let yaw=.80,pitch=.20,dist=126,target=[0,8,0],drag=false,lx=0,ly=0,pinch=0;const views={hero:[.80,.20,126,[0,8,0]],profile:[1.57,.10,150,[0,8,0]],aft:[-1.05,.17,102,[-27,6,0]],bow:[2.18,.15,98,[26,7,0]],top:[.80,.78,122,[0,6,0]]};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{let v=views[b.dataset.v];yaw=v[0];pitch=v[1];dist=v[2];target=[...v[3]]});c.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(-.08,Math.min(.82,pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY};c.onpointerup=()=>drag=false;c.onwheel=e=>{e.preventDefault();dist=Math.max(28,Math.min(260,dist*(1+e.deltaY*.001)))},{passive:false};c.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);if(pinch)dist=Math.max(28,Math.min(260,dist*pinch/d));pinch=d}},{passive:false});c.addEventListener('touchend',()=>pinch=0);

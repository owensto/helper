<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06131a"><title>ATLAS D 272</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06131a;color:#eef6f6;font-family:Inter,system-ui,-apple-system,sans-serif}model-viewer{width:100%;height:100%;background:linear-gradient(#9dbfca 0%,#5c8797 46%,#073043 47%,#02131c 100%)}header{position:fixed;z-index:4;top:max(16px,env(safe-area-inset-top));left:16px;background:#071921df;border:1px solid #ffffff25;border-radius:16px;padding:15px 18px;backdrop-filter:blur(12px)}.ey{font-size:9px;letter-spacing:2.4px;color:#9db7bc}h1{margin:4px 0;font-weight:500;letter-spacing:3px;font-size:24px}.spec{font-size:11px;color:#b8cbce}nav{position:fixed;z-index:4;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;background:#071921df;border:1px solid #ffffff25;border-radius:14px;padding:7px;backdrop-filter:blur(12px);max-width:calc(100vw - 24px);overflow:auto}button{border:1px solid transparent;background:transparent;color:#eef6f6;border-radius:9px;padding:10px 13px;white-space:nowrap}button.active,button:hover{background:#ffffff1f;border-color:#ffffff2c}.mode{position:fixed;right:16px;top:max(16px,env(safe-area-inset-top));z-index:4;background:#071921df;border:1px solid #ffffff25;border-radius:16px;padding:8px;display:flex;gap:4px}.status{position:fixed;z-index:4;left:16px;bottom:max(80px,calc(env(safe-area-inset-bottom) + 64px));font-size:11px;color:#d1e0e2;background:#071921c9;padding:8px 11px;border-radius:9px}@media(max-width:650px){header{left:10px;top:max(10px,env(safe-area-inset-top));padding:10px 12px}h1{font-size:19px}.mode{right:10px;top:max(10px,env(safe-area-inset-top));flex-direction:column}.mode button{padding:7px 9px;font-size:10px}nav{left:10px;transform:none;width:calc(100vw - 20px);justify-content:flex-start}.status{left:10px}}</style><script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script></head><body><model-viewer id="mv" src="./ATLAS_D_272.glb" camera-controls autoplay animation-crossfade-duration="800" shadow-intensity=".8" exposure="1.0" environment-image="neutral" camera-orbit="55deg 72deg 132m" field-of-view="32deg"></model-viewer><header><div class="ey">DUAL-DOMAIN CONCEPT</div><h1>ATLAS D 272</h1><div class="spec">82.9 m / 272 ft · 14.2 m beam</div></header><div class="mode"><button id="surface" class="active">SURFACE</button><button id="dive">DIVE</button><button id="xray">X-RAY</button></div><div class="status" id="status">Surface configuration</div><nav><button data-orbit="55deg 72deg 132m" class="active">Hero</button><button data-orbit="90deg 80deg 145m">Profile</button><button data-orbit="145deg 72deg 120m">Stern</button><button data-orbit="25deg 72deg 120m">Bow</button><button data-orbit="55deg 84deg 105m">Submerged</button></nav><script>const m=document.querySelector('#mv'),status=document.querySelector('#status');const setMode=(mode)=>{document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('active',b.id===mode));if(mode==='surface'){m.currentTime=0;m.pause();status.textContent='Surface configuration'}else if(mode==='dive'){m.currentTime=0;m.play();status.textContent='Transformation → submerged configuration'}else{m.pause();status.textContent='X-ray system view — use model inspector build for layer isolation';m.cameraOrbit='55deg 76deg 100m'}};surface.onclick=()=>setMode('surface');dive.onclick=()=>setMode('dive');xray.onclick=()=>setMode('xray');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');m.cameraOrbit=b.dataset.orbit});</script></body></html>

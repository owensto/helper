name: ATLAS D R10 Slate and Titanium
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_d_slate_r10/transport/**'
      - '.github/workflows/atlas-d-slate-r10.yml'
permissions:
  contents: write
concurrency:
  group: atlas-d-slate-r10
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore checked source and pinned R9 model
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          root=Path('atlas_d_slate_r10')
          encoded=''.join((root/'transport'/f'part{i}.b64').read_text().strip() for i in range(3))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='a0f810109b6078b2b7ac82a41fb699774435962136d2b26e3ea52d205e48f39c','Source checksum mismatch'
          bundle=json.loads(lzma.decompress(data))
          for rel,text in bundle.items():
              assert rel.startswith(('source/','site/')) and '..' not in Path(rel).parts
              p=root/rel;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          print('Restored',len(bundle),'source files')
          PY
          git fetch --no-tags origin cb018adf5e018fa40bd0e331e54aa619720892d2
          mkdir -p /tmp/atlas10-base
          git show cb018adf5e018fa40bd0e331e54aa619720892d2:atlas_d_fit_r9/live/ATLAS_D_R9.glb > /tmp/atlas10-base/ATLAS_D_R9.glb
          git show cb018adf5e018fa40bd0e331e54aa619720892d2:atlas_d_fit_r9/live/runtime.js > atlas_d_slate_r10/site/runtime.js
          git show cb018adf5e018fa40bd0e331e54aa619720892d2:atlas_d_fit_r9/live/THIRD_PARTY_LICENSE.txt > atlas_d_slate_r10/site/THIRD_PARTY_LICENSE.txt
          echo '1174575c16ddda3fa3e54a4be9176b8b740a25070d6ac847fb7508bae84fdb1e  /tmp/atlas10-base/ATLAS_D_R9.glb' | sha256sum -c
      - name: Apply actual materials and detailed exterior meshes
        env:
          ATLAS_ROOT: ${{ github.workspace }}/atlas_d_slate_r10
          ATLAS_SOURCE: /tmp/atlas10-base/ATLAS_D_R9.glb
        run: |
          python -m pip install -q numpy==2.3.5 trimesh==4.11.1 scipy networkx pillow playwright==1.55.0
          python atlas_d_slate_r10/source/build.py
          node --check atlas_d_slate_r10/site/viewer.js
      - name: Install browser
        run: python -m playwright install --with-deps chromium >/dev/null
      - name: Test blue and gray finishes and detailed animated model
        run: |
          mkdir -p /tmp/atlas10/review
          python -m http.server 8810 --bind 127.0.0.1 --directory atlas_d_slate_r10/site >/tmp/atlas10/http.log 2>&1 &
          sleep 2
          python atlas_d_slate_r10/source/verify.py
      - name: Save native Blender scene with packed textures
        env:
          ATLAS_ROOT: ${{ github.workspace }}/atlas_d_slate_r10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 >/dev/null
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/blender -b --python-exit-code 1 --python atlas_d_slate_r10/source/native.py
          test -s /tmp/atlas10/native/ATLAS_D_R10_Slate_Titanium.blend
      - name: Publish separate tested detail edition
        id: release
        run: |
          mkdir -p atlas_d_slate_r10/live
          cp -R atlas_d_slate_r10/site/. atlas_d_slate_r10/live/
          cp /tmp/atlas10/review/validation.json atlas_d_slate_r10/live/browser_validation.json
          cp /tmp/atlas10/native/native_report.json atlas_d_slate_r10/live/native_report.json
          git config user.name 'ATLAS release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas_d_slate_r10
          git commit -m 'Publish slate-blue and titanium ATLAS D with detailed exterior fittings'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "url=https://rawcdn.githack.com/owensto/helper/$(git rev-parse HEAD)/atlas_d_slate_r10/live/index.html" >> "$GITHUB_OUTPUT"
      - name: Verify the exact public URL
        env:
          BASE_URL: ${{ steps.release.outputs.url }}
          REVIEW_DIR: /tmp/atlas10/public
        run: python atlas_d_slate_r10/source/verify.py
      - name: Record public verification
        run: |
          cp /tmp/atlas10/public/validation.json atlas_d_slate_r10/release_validation.json
          git add atlas_d_slate_r10/release_validation.json
          git commit -m 'Record ATLAS D R10 public browser validation, not engineering qualification'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-D-R10-Slate-Titanium-Detail-Edition
          path: |
            /tmp/atlas10/
            atlas_d_slate_r10/site/
            atlas_d_slate_r10/source/
          retention-days: 30

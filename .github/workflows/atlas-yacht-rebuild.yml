name: ATLAS yacht rebuild
on:
  push:
    branches: ['atlas/yacht-rebuild-20261017']
    paths: ['atlas_yacht_rebuild/**', '.github/workflows/atlas-yacht-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-yacht-rebuild-20261017
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            atlas_yacht_rebuild
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare unchanged pinned runtime and check own source
        run: |
          test "$GITHUB_REF_NAME" = atlas/yacht-rebuild-20261017
          git fetch --depth=1 origin a2d4eecc12e7b4db14c7f94a6f6fc5088a4061ff
          mkdir -p atlas_yacht_rebuild/site/vendor
          git show a2d4eecc12e7b4db14c7f94a6f6fc5088a4061ff:atlas_sealab_12/live/runtime.js > atlas_yacht_rebuild/site/vendor/runtime.js
          echo '50a297fabc59ff592031fa916d3fc17511d55747fd11fcdfbd7119bc6148b7f4  atlas_yacht_rebuild/site/vendor/runtime.js' | sha256sum -c -
          python atlas_yacht_rebuild/polish.py
          python atlas_yacht_rebuild/finish.py
          for p in atlas_yacht_rebuild/site/*.js; do node --check "$p"; done
          python -m py_compile atlas_yacht_rebuild/verify.py
          cd atlas_yacht_rebuild
          node test-physics.cjs > physics.stdout
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium > /tmp/rebuild-browser-install.log
      - name: Actual candidate scene and native operation
        env:
          REVIEW_DIR: /tmp/atlas-rebuild-review/local
        run: |
          python -m http.server 8928 --bind 127.0.0.1 --directory atlas_yacht_rebuild/site > /tmp/rebuild-http.log 2>&1 &
          sleep 2
          python atlas_yacht_rebuild/verify.py
      - name: Publish only this isolated rebuilt yacht
        id: publish
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          root=Path('atlas_yacht_rebuild/site')
          record={'sourceSHA':os.environ['GITHUB_SHA'],'status':'candidate browser passed; public check follows','newModel':True,'originalDemosUnchanged':True,'humanContact':False,'multiplayer':False,'submersible':False,'files':{str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='BUILD.json'}}
          (root/'BUILD.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          git config user.name 'ATLAS yacht release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas_yacht_rebuild/site atlas_yacht_rebuild/test-physics.cjs atlas_yacht_rebuild/verify.py
          git commit -m 'Publish tested standalone rebuilt yacht assets [skip ci]'
          git push origin HEAD:refs/heads/atlas/yacht-rebuild-20261017
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Actual public loading and operation
        env:
          REVIEW_DIR: /tmp/atlas-rebuild-review/public
          BASE_URL: https://rawcdn.githack.com/owensto/helper/${{ steps.publish.outputs.sha }}/atlas_yacht_rebuild/site/index.html
        run: python atlas_yacht_rebuild/verify.py
      - name: Preserve exact source and honest results
        if: always()
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          mkdir -p /tmp/atlas-rebuild-review/source
          cp atlas_yacht_rebuild/site/*.* /tmp/atlas-rebuild-review/source/
          cp atlas_yacht_rebuild/test-physics.cjs atlas_yacht_rebuild/verify.py atlas_yacht_rebuild/polish.py atlas_yacht_rebuild/finish.py /tmp/atlas-rebuild-review/source/
          cp atlas_yacht_rebuild/physics-results.json atlas_yacht_rebuild/physics.stdout /tmp/atlas-rebuild-review/ 2>/dev/null || true
          cp /tmp/rebuild-http.log /tmp/atlas-rebuild-review/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          r=Path('/tmp/atlas-rebuild-review')
          (r/'provenance.json').write_text(json.dumps({'sourceSHA':os.environ['GITHUB_SHA'],'publicSHA':os.environ.get('PUBLIC_SHA'),'runner':'GitHub Actions; headless Chromium/SwiftShader','localBrowserInChat':'administratively blocked; not bypassed'},indent=2))
          h={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()}
          (r/'sha256.json').write_text(json.dumps(h,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-yacht-rebuild-review
          path: /tmp/atlas-rebuild-review/
          retention-days: 14

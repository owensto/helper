name: ATLAS-W arcade gunnery
on:
  push:
    branches: ['atlas/fleet-gunnery-20261023']
    paths: ['atlas_fleet_gunnery/**', '.github/workflows/atlas-gunnery.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-fleet-gunnery-20261023
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      public_sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: atlas_fleet_gunnery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble exact fleet with tested visual cleanup
        run: |
          test "$GITHUB_REF_NAME" = atlas/fleet-gunnery-20261023
          git fetch --depth=1 origin 8d7df3837046bdbf3b04bf4c4fca245a37aba2a5
          python atlas_fleet_gunnery/finish.py
          python atlas_fleet_gunnery/build.py
          for p in atlas_fleet_gunnery/site/*.js; do node --check "$p"; done
          python -m py_compile atlas_fleet_gunnery/verify.py
          cd atlas_fleet_gunnery
          node --test test.cjs test-ui.cjs > unit.tap
      - name: Publish isolated candidate for real public acceptance
        id: publish
        run: |
          test "$(git ls-remote origin refs/heads/atlas/fleet-gunnery-20261023 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'ATLAS gunnery release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas_fleet_gunnery/site
          git commit -m 'Publish corrected gunnery candidate for public checks [skip ci]'
          git push origin HEAD:refs/heads/atlas/fleet-gunnery-20261023
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve generated site and executed logic
        if: always()
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          mkdir -p /tmp/atlas-gunnery-build
          cp -r atlas_fleet_gunnery /tmp/atlas-gunnery-build/
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          r=Path('/tmp/atlas-gunnery-build')
          (r/'provenance.json').write_text(json.dumps({'sourceSHA':os.environ['GITHUB_SHA'],'publicSHA':os.environ.get('PUBLIC_SHA'),'candidateOnly':True},indent=2))
          (r/'sha256.json').write_text(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-W-gunnery-build
          path: /tmp/atlas-gunnery-build/
          retention-days: 14
  public:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        layout: [portrait, small-phone, landscape, desktop]
    env:
      REVIEW_DIR: /tmp/atlas-gunnery-public
      BASE_URL: https://rawcdn.githack.com/owensto/helper/${{ needs.build.outputs.public_sha }}/atlas_fleet_gunnery/site/index.html
      LAYOUT: ${{ matrix.layout }}
      PUBLIC_SHA: ${{ needs.build.outputs.public_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.public_sha }}
          persist-credentials: false
          sparse-checkout: atlas_fleet_gunnery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare same assertions and pinned browser
        run: |
          python atlas_fleet_gunnery/finish.py
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium > /tmp/gunnery-browser-install.log
      - name: Actual public touch aim fire score and sailing checks
        run: python atlas_fleet_gunnery/verify.py
      - name: Preserve raw evidence including failures
        if: always()
        run: |
          mkdir -p "$REVIEW_DIR/source"
          cp atlas_fleet_gunnery/verify.py atlas_fleet_gunnery/finish.py "$REVIEW_DIR/source/"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          r=Path(os.environ['REVIEW_DIR'])
          (r/'provenance.json').write_text(json.dumps({'sourceSHA':os.environ['GITHUB_SHA'],'publicSHA':os.environ['PUBLIC_SHA'],'layout':os.environ['LAYOUT'],'scope':'Chromium SwiftShader emulated touch, no physical device'},indent=2))
          (r/'sha256.json').write_text(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-W-gunnery-${{ matrix.layout }}
          path: /tmp/atlas-gunnery-public/
          retention-days: 14

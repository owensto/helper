name: ATLAS-W arcade gunnery
on:
  push:
    branches: ['atlas/fleet-gunnery-20261023']
    paths: ['atlas_fleet_gunnery/**', '.github/workflows/atlas-gunnery.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-fleet-gunnery-20261023
  cancel-in-progress: false
jobs:
  gunnery:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            atlas_fleet_gunnery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble pinned fleet and test fictional range logic
        run: |
          test "$GITHUB_REF_NAME" = atlas/fleet-gunnery-20261023
          git fetch --depth=1 origin 8d7df3837046bdbf3b04bf4c4fca245a37aba2a5
          python atlas_fleet_gunnery/build.py
          for p in atlas_fleet_gunnery/site/*.js; do node --check "$p"; done
          python -m py_compile atlas_fleet_gunnery/verify.py
          cd atlas_fleet_gunnery
          node --test test.cjs > unit.tap
      - name: Prepare existing test browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium > /tmp/gunnery-browser-install.log
      - name: Candidate mobile aiming firing and sailing regression
        env:
          REVIEW_DIR: /tmp/atlas-gunnery-review/local
        run: |
          python -m http.server 8933 --bind 127.0.0.1 --directory atlas_fleet_gunnery/site > /tmp/gunnery-http.log 2>&1 &
          sleep 2
          python atlas_fleet_gunnery/verify.py
      - name: Publish only the new gunnery candidate
        id: publish
        run: |
          git config user.name 'ATLAS gunnery release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas_fleet_gunnery/site
          git commit -m 'Publish tested arcade-gunnery candidate [skip ci]'
          git push origin HEAD:refs/heads/atlas/fleet-gunnery-20261023
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify actual public gunnery and vessel identity
        env:
          REVIEW_DIR: /tmp/atlas-gunnery-review/public
          BASE_URL: https://rawcdn.githack.com/owensto/helper/${{ steps.publish.outputs.sha }}/atlas_fleet_gunnery/site/index.html
        run: python atlas_fleet_gunnery/verify.py
      - name: Preserve exact source and outcomes
        if: always()
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          mkdir -p /tmp/atlas-gunnery-review/source /tmp/atlas-gunnery-review/site
          cp atlas_fleet_gunnery/*.js atlas_fleet_gunnery/*.css atlas_fleet_gunnery/*.py atlas_fleet_gunnery/*.cjs /tmp/atlas-gunnery-review/source/ 2>/dev/null || true
          cp atlas_fleet_gunnery/site/*.* /tmp/atlas-gunnery-review/site/ 2>/dev/null || true
          cp atlas_fleet_gunnery/unit.tap /tmp/atlas-gunnery-review/ 2>/dev/null || true
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          r=Path('/tmp/atlas-gunnery-review')
          (r/'provenance.json').write_text(json.dumps({'sourceSHA':os.environ['GITHUB_SHA'],'publicSHA':os.environ.get('PUBLIC_SHA'),'browserScope':'headless Chromium/SwiftShader, emulated touch; not physical hardware'},indent=2))
          (r/'sha256.json').write_text(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-W-gunnery-review
          path: /tmp/atlas-gunnery-review/
          retention-days: 14

name: ATLAS Beaufort Wildlife and Views static preview
on:
  workflow_dispatch:
  push:
    branches: ['atlas/beaufort-cruise-20261018']
    paths:
      - 'atlas_beaufort_cruise/source/harbor4/**'
      - '.github/workflows/atlas-beaufort-cruise.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-beaufort-cruise-preview
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.ref == 'refs/heads/atlas/beaufort-cruise-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4139361fb5f407536b5bab227e44c7baf1ce387e
          path: _harbor_base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test actual policies, model, geography and scene without browser navigation
        run: |
          python atlas_beaufort_cruise/source/harbor4/build.py --base _harbor_base/atlas_beaufort_cruise/site --out /tmp/bc-harbor4
          python atlas_beaufort_cruise/source/harbor4/check.py --site /tmp/bc-harbor4 --base _harbor_base/atlas_beaufort_cruise/site --base-source _harbor_base/atlas_beaufort_cruise/source --easy atlas_easy_helm --out atlas_beaufort_cruise/source/harbor4/checks
      - name: Require all CPU gates and retain honest graphics and device status
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil,os
          r=Path('atlas_beaufort_cruise');src=r/'source/harbor4';site=r/'site';compiled=Path('/tmp/bc-harbor4')
          d=json.loads((src/'checks/verification.json').read_text())
          assert d['passed'] and d['cpuChecks']==84 and len(d['modeledPowerTrials'])==4
          assert d['browserVerified'] is False and d['GPUVerified'] is False
          assert len(d['build']['changed'])==9 and d['build']['geographyChanged'] is False
          assert not any(p.suffix.lower() in ['.ttf','.otf','.woff','.woff2'] for p in compiled.rglob('*'))
          shutil.rmtree(site);shutil.copytree(compiled,site)
          shutil.copy2(src/'README.md',r/'WILDLIFE_VIEWS_4.md')
          files={str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(site.rglob('*')) if p.is_file()}
          record={'version':'Wildlife & Views 4','status':'PUBLIC_REVIEW_CANDIDATE','source_commit':os.environ['GITHUB_SHA'],'build_run':os.environ['GITHUB_RUN_ID'],'cpu_checks_passed':84,'browserVerified':False,'GPUVerified':False,'actualMusicPlaybackVerified':False,'physicalDeviceVerified':False,'CDNVerified':False,'frameRateVerified':False,'photorealismVerified':False,'files':files}
          (r/'BUILD4.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Publish complete static candidate only to this existing isolated branch
        id: publication
        run: |
          git config user.name 'ATLAS preview build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f atlas_beaufort_cruise/site atlas_beaufort_cruise/WILDLIFE_VIEWS_4.md atlas_beaufort_cruise/BUILD4.json atlas_beaufort_cruise/source/harbor4/checks
          test -z "$(git diff --cached --name-only | grep -v '^atlas_beaufort_cruise/' || true)"
          git diff --cached --quiet || git commit -m 'Publish Beaufort Wildlife and Views4: dolphins, camera modes, local recovery and consistent interface [skip ci]'
          git push origin HEAD:refs/heads/atlas/beaufort-cruise-20261018
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record exact preview URL and prepare complete portable site
        env:
          PUBLIC_COMMIT: ${{ steps.publication.outputs.commit }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,shutil
          r=Path('atlas_beaufort_cruise');out=Path('/tmp/atlas-harbor4-delivery');out.mkdir()
          sha=os.environ['PUBLIC_COMMIT'];url=f'https://rawcdn.githack.com/owensto/helper/{sha}/atlas_beaufort_cruise/site/index.html'
          d={'version':'Wildlife & Views 4','url':url,'published_commit':sha,'status':'STATIC_PREVIEW_COMMITTED','source_commit':os.environ['GITHUB_SHA'],'build_run':os.environ['GITHUB_RUN_ID'],'cpu_checks_passed':84,'browserVerified':False,'CDNVerified':False,'GPUVerified':False,'physicalDeviceVerified':False,'frameRateVerified':False,'photorealismVerified':False,'note':'Complete static site committed after CPU/model/geography tests. No browser, current public-response, actual audio playback or GPU verification performed.'}
          for name in ['DELIVERY.json','DELIVERY4.json']:(r/name).write_text(json.dumps(d,indent=2)+'\n')
          for name in ['BUILD4.json','DELIVERY4.json','WILDLIFE_VIEWS_4.md']:shutil.copy2(r/name,out/name)
          shutil.copy2(r/'source/harbor4/checks/verification.json',out/'verification.json')
          pkg=out/'Atlas_Beaufort_Wildlife_4';shutil.copytree(r/'site',pkg/'site');shutil.copytree(r/'source',pkg/'source',ignore=shutil.ignore_patterns('__pycache__'))
          shutil.copy2(r/'WILDLIFE_VIEWS_4.md',pkg/'README.md');shutil.copy2(r/'GAME_PLAN.md',pkg/'GAME_PLAN.md');shutil.copy2(r/'DELIVERY4.json',pkg/'PLAY_ONLINE.json')
          assert not any(p.suffix.lower() in ['.ttf','.otf','.woff','.woff2'] for p in pkg.rglob('*'))
          shutil.make_archive(str(out/'Atlas_Beaufort_Wildlife_4'),'zip',root_dir=pkg);shutil.rmtree(pkg)
          PY
          git add atlas_beaufort_cruise/DELIVERY.json atlas_beaufort_cruise/DELIVERY4.json
          git diff --cached --quiet || git commit -m 'Record Wildlife and Views4 link with explicit unverified device and graphics scope [skip ci]'
          git push origin HEAD:refs/heads/atlas/beaufort-cruise-20261018
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Beaufort-Wildlife-Views4
          path: |
            /tmp/atlas-harbor4-delivery/
            atlas_beaufort_cruise/source/harbor4/checks/
          retention-days: 30

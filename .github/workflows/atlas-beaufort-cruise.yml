name: ATLAS Beaufort clean helm static preview
on:
  workflow_dispatch:
  push:
    branches: ['atlas/beaufort-cruise-20261018']
    paths:
      - 'atlas_beaufort_cruise/source/device/**'
      - '.github/workflows/atlas-beaufort-cruise.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-beaufort-cruise-preview
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.ref == 'refs/heads/atlas/beaufort-cruise-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: cdc915afef276e192786e5bb389c5b4fb4c3262e
          path: _device_base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned device revision and run CPU checks only
        run: |
          python atlas_beaufort_cruise/source/device/build-device.py --base _device_base/atlas_beaufort_cruise/site --out /tmp/bc-clean-helm
          python atlas_beaufort_cruise/source/device/check-device.py --base-site _device_base/atlas_beaufort_cruise/site --base-source _device_base/atlas_beaufort_cruise/source --easy atlas_easy_helm --site /tmp/bc-clean-helm --evidence atlas_beaufort_cruise/source/device/checks
      - name: Require all functional gates and preserve independent browser status
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          r=Path('atlas_beaufort_cruise');src=r/'source/device';site=r/'site'
          d=json.loads((src/'checks/verification.json').read_text())
          assert d['passed'] and d['cpuChecks']==69 and d['modeledPowerTrials']==4
          assert d['browserVerified'] is False and d['GPUVerified'] is False
          assert d['build']['unchangedFiles']==272 and d['build']['simulationClockChanged'] is False
          compiled=Path('/tmp/bc-clean-helm')
          assert not any(p.suffix.lower() in ['.ttf','.otf','.woff','.woff2'] for p in compiled.rglob('*'))
          shutil.copytree(compiled,site,dirs_exist_ok=True)
          shutil.copy2(src/'README.md',r/'CLEAN_HELM_2.md')
          files={str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(site.rglob('*')) if p.is_file()}
          record={'version':'Clean Helm 2','status':'PUBLIC_REVIEW_CANDIDATE','source_commit':os.environ['GITHUB_SHA'],'build_run':os.environ['GITHUB_RUN_ID'],'cpu_checks_passed':69,'modeled_power_trials':4,'browserVerified':False,'GPUVerified':False,'actualMusicPlaybackVerified':False,'physicalDeviceVerified':False,'CDNVerified':False,'frameRateVerified':False,'files':files}
          (r/'BUILD2.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Commit full static candidate on this isolated branch only
        id: publication
        run: |
          git config user.name 'ATLAS preview build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f atlas_beaufort_cruise/site atlas_beaufort_cruise/CLEAN_HELM_2.md atlas_beaufort_cruise/BUILD2.json atlas_beaufort_cruise/source/device/checks
          test -z "$(git diff --cached --name-only | grep -v '^atlas_beaufort_cruise/' || true)"
          git diff --cached --quiet || git commit -m 'Publish Beaufort Clean Helm 2: proportional controls, clear power limits and reduced redundant work [skip ci]'
          git push origin HEAD:refs/heads/atlas/beaufort-cruise-20261018
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record review link and package complete site
        env:
          PUBLIC_COMMIT: ${{ steps.publication.outputs.commit }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,shutil
          r=Path('atlas_beaufort_cruise');out=Path('/tmp/atlas-clean-helm-delivery');out.mkdir()
          sha=os.environ['PUBLIC_COMMIT'];url=f'https://rawcdn.githack.com/owensto/helper/{sha}/atlas_beaufort_cruise/site/index.html'
          d={'version':'Clean Helm 2','url':url,'published_commit':sha,'status':'STATIC_PREVIEW_COMMITTED','source_commit':os.environ['GITHUB_SHA'],'build_run':os.environ['GITHUB_RUN_ID'],'cpu_checks_passed':69,'modeled_power_trials':4,'browserVerified':False,'CDNVerified':False,'GPUVerified':False,'physicalDeviceVerified':False,'frameRateVerified':False,'note':'Complete static candidate committed after CPU checks. No browser, current public-response, GPU, actual audio playback or device verification performed.'}
          for name in ['DELIVERY.json','DELIVERY2.json']:(r/name).write_text(json.dumps(d,indent=2)+'\n')
          for name in ['BUILD2.json','DELIVERY2.json','CLEAN_HELM_2.md']:shutil.copy2(r/name,out/name)
          shutil.copy2(r/'source/device/checks/verification.json',out/'verification.json')
          pkg=out/'Atlas_Beaufort_Clean_Helm_2';shutil.copytree(r/'site',pkg/'site');shutil.copytree(r/'source',pkg/'source',ignore=shutil.ignore_patterns('__pycache__'))
          shutil.copy2(r/'CLEAN_HELM_2.md',pkg/'README.md');shutil.copy2(r/'README.md',pkg/'ORIGINAL_BEAUFORT_README.md');shutil.copy2(r/'DELIVERY2.json',pkg/'PLAY_ONLINE.json')
          assert not any(p.suffix.lower() in ['.ttf','.otf','.woff','.woff2'] for p in pkg.rglob('*'))
          shutil.make_archive(str(out/'Atlas_Beaufort_Clean_Helm_2'),'zip',root_dir=pkg)
          shutil.rmtree(pkg)
          PY
          git add atlas_beaufort_cruise/DELIVERY.json atlas_beaufort_cruise/DELIVERY2.json
          git diff --cached --quiet || git commit -m 'Record Clean Helm 2 static preview URL with explicit unverified device and browser status [skip ci]'
          git push origin HEAD:refs/heads/atlas/beaufort-cruise-20261018
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Beaufort-Clean-Helm2
          path: |
            /tmp/atlas-clean-helm-delivery/
            atlas_beaufort_cruise/source/device/checks/
          retention-days: 30

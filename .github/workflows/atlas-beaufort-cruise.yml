name: ATLAS Beaufort Lightweight Realism static preview
on:
  workflow_dispatch:
  push:
    branches: ['atlas/beaufort-cruise-20261018']
    paths:
      - 'atlas_beaufort_cruise/source/realism5/**'
      - '.github/workflows/atlas-beaufort-cruise.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-beaufort-cruise-preview
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.ref == 'refs/heads/atlas/beaufort-cruise-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 2c2e75a441b5660d40eb5327b3a72f92acbd4ef2
          path: _realism_base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact candidate and execute CPU, geometry and native-runtime checks
        run: |
          python atlas_beaufort_cruise/source/realism5/build.py --base _realism_base/atlas_beaufort_cruise/site --out /tmp/bc-realism5
          python atlas_beaufort_cruise/source/realism5/check.py --site /tmp/bc-realism5 --base _realism_base/atlas_beaufort_cruise/site --base-source _realism_base/atlas_beaufort_cruise/source --easy atlas_easy_helm --out atlas_beaufort_cruise/source/realism5/checks
          node atlas_beaufort_cruise/source/realism5/benchmark.cjs /tmp/bc-realism5 _realism_base/atlas_beaufort_cruise/site > atlas_beaufort_cruise/source/realism5/checks/benchmark.json
      - name: Preserve test scope and prepare complete lightweight static candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil,os
          r=Path('atlas_beaufort_cruise');src=r/'source/realism5';site=r/'site';compiled=Path('/tmp/bc-realism5')
          d=json.loads((src/'checks/verification.json').read_text());bench=json.loads((src/'checks/benchmark.json').read_text())
          assert d['passed'] and d['cpuChecks']==107 and len(d['powerTrials'])==4
          assert bench['passed'] and all(v['sameResult'] for v in bench['results'].values())
          assert d['browserVerified'] is False and d['GPUVerified'] is False and d['FPSVerified'] is False
          assert len(d['build']['changed'])==10 and d['build']['unchanged']==285
          assert d['build']['newTextures']==0 and d['build']['newDrawCalls']==0 and d['build']['forceCoefficientsChanged'] is False
          assert d['addedSiteBytes']<30000
          assert not any(p.suffix.lower() in ['.ttf','.otf','.woff','.woff2'] for p in compiled.rglob('*'))
          shutil.copytree(compiled,site,dirs_exist_ok=True)
          shutil.copy2(src/'README.md',r/'LIGHTWEIGHT_REALISM_5.md')
          # Fixture copies are reproducible from pinned previous source and are not product assets.
          shutil.rmtree(src/'checks/fixtures')
          files={str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(site.rglob('*')) if p.is_file()}
          assert len(files)==299
          record={'version':'Dolphins & Lightweight Realism 5','status':'PUBLIC_REVIEW_CANDIDATE','source_commit':os.environ['GITHUB_SHA'],'build_run':os.environ['GITHUB_RUN_ID'],'cpu_checks_passed':107,'modeled_power_trials':4,'added_site_bytes':d['addedSiteBytes'],'new_models':0,'new_textures':0,'new_render_passes':0,'browserVerified':False,'GPUVerified':False,'actualMusicPlaybackVerified':False,'physicalDeviceVerified':False,'CDNVerified':False,'frameRateVerified':False,'files':files}
          (r/'BUILD5.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Commit candidate only to the existing isolated branch
        id: publication
        run: |
          git config user.name 'ATLAS preview build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f atlas_beaufort_cruise/site atlas_beaufort_cruise/LIGHTWEIGHT_REALISM_5.md atlas_beaufort_cruise/BUILD5.json atlas_beaufort_cruise/source/realism5/checks
          test -z "$(git diff --cached --name-only | grep -v '^atlas_beaufort_cruise/' || true)"
          git diff --cached --quiet || git commit -m 'Publish Beaufort Realism5: find dolphins, analytic wave response and lighter effects [skip ci]'
          git push origin HEAD:refs/heads/atlas/beaufort-cruise-20261018
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record exact preview and package complete static site with honest acceptance status
        env:
          PUBLIC_COMMIT: ${{ steps.publication.outputs.commit }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,shutil
          r=Path('atlas_beaufort_cruise');out=Path('/tmp/atlas-realism5-delivery');out.mkdir()
          sha=os.environ['PUBLIC_COMMIT'];url=f'https://rawcdn.githack.com/owensto/helper/{sha}/atlas_beaufort_cruise/site/index.html'
          d={'version':'Dolphins & Lightweight Realism 5','url':url,'published_commit':sha,'status':'STATIC_PREVIEW_COMMITTED','source_commit':os.environ['GITHUB_SHA'],'build_run':os.environ['GITHUB_RUN_ID'],'cpu_checks_passed':107,'browserVerified':False,'CDNVerified':False,'GPUVerified':False,'physicalDeviceVerified':False,'frameRateVerified':False,'photorealismVerified':False,'note':'Complete static site committed after native CPU/math/geography and synthetic-interface tests. No browser/public-response/GPU/touch/playback or actual FPS verification. Dolphin camera projection is not rendered visibility proof.'}
          for name in ['DELIVERY.json','DELIVERY5.json']:(r/name).write_text(json.dumps(d,indent=2)+'\n')
          for name in ['BUILD5.json','DELIVERY5.json','LIGHTWEIGHT_REALISM_5.md']:shutil.copy2(r/name,out/name)
          for name in ['verification.json','benchmark.json']:shutil.copy2(r/'source/realism5/checks'/name,out/name)
          pkg=out/'Atlas_Beaufort_Realism_5';shutil.copytree(r/'site',pkg/'site');shutil.copytree(r/'source',pkg/'source',ignore=shutil.ignore_patterns('__pycache__'))
          shutil.copy2(r/'LIGHTWEIGHT_REALISM_5.md',pkg/'README.md');shutil.copy2(r/'DELIVERY5.json',pkg/'PLAY_ONLINE.json')
          assert not any(p.suffix.lower() in ['.ttf','.otf','.woff','.woff2'] for p in pkg.rglob('*'))
          shutil.make_archive(str(out/'Atlas_Beaufort_Realism_5'),'zip',root_dir=pkg);shutil.rmtree(pkg)
          PY
          git add atlas_beaufort_cruise/DELIVERY.json atlas_beaufort_cruise/DELIVERY5.json
          git diff --cached --quiet || git commit -m 'Record Realism5 preview link and unverified device/graphics scope [skip ci]'
          git push origin HEAD:refs/heads/atlas/beaufort-cruise-20261018
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Beaufort-Realism5
          path: |
            /tmp/atlas-realism5-delivery/
            atlas_beaufort_cruise/source/realism5/checks/
          retention-days: 30

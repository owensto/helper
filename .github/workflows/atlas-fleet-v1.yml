name: ATLAS Fleet 01
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_fleet_v1/transport/**'
      - 'atlas_fleet_v1/patch.py'
      - 'atlas_fleet_v1/REVIEW.md'
      - '.github/workflows/atlas-fleet-v1.yml'
permissions:
  contents: write
concurrency:
  group: atlas-fleet-v1
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore verified source and unchanged R10 reference
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          root=Path('atlas_fleet_v1')
          text=''.join((root/'transport'/f'part{i}.b64').read_text().strip() for i in range(7))
          data=base64.b64decode(text,validate=True)
          assert hashlib.sha256(data).hexdigest()=='699a9ea5fe9fccc73222cd089e7bea2c121ad1a1efa6aff88cbf36e38b400703','Transport checksum mismatch'
          source=json.loads(lzma.decompress(data))
          for path,content in source.items():
              assert path.startswith(('source/','site/')) and '..' not in Path(path).parts
              dest=root/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(content)
          print('Verified source files:',len(source))
          PY
          git fetch --no-tags origin 3a532afd6f899c608ebfd4e60525d6b8379e2e0a
          mkdir -p atlas_fleet_v1/base/r10/viewer atlas_fleet_v1/site/assets atlas_fleet_v1/models
          git show 3a532afd6f899c608ebfd4e60525d6b8379e2e0a:atlas_d_slate_r10/live/ATLAS_D_R10.glb > atlas_fleet_v1/base/r10/viewer/ATLAS_D_R10.glb
          git show 3a532afd6f899c608ebfd4e60525d6b8379e2e0a:atlas_d_slate_r10/live/runtime.js > atlas_fleet_v1/site/runtime.js
          git show 3a532afd6f899c608ebfd4e60525d6b8379e2e0a:atlas_d_slate_r10/live/THIRD_PARTY_LICENSE.txt > atlas_fleet_v1/site/THIRD_PARTY_LICENSE.txt
          if [ -f atlas_fleet_v1/patch.py ]; then python atlas_fleet_v1/patch.py; fi
      - name: Build original fleet and integrate rigid T-top fishing boat
        env:
          FLEET_ROOT: ${{ github.workspace }}/atlas_fleet_v1
        run: |
          python -m pip install -q numpy==2.3.5 trimesh==4.11.1 scipy networkx shapely matplotlib pillow playwright==1.55.0
          python atlas_fleet_v1/source/build_fleet.py
          python atlas_fleet_v1/source/assemble.py
      - name: Create five editable Blender masters and export their real geometry
        env:
          FLEET_ROOT: ${{ github.workspace }}/atlas_fleet_v1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 >/dev/null
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/blender -b --python-exit-code 1 --python atlas_fleet_v1/source/native.py
          python atlas_fleet_v1/source/split_interiors.py
          test "$(find atlas_fleet_v1/models -name '*.blend' | wc -l)" -eq 5
      - name: Install browser
        run: python -m playwright install --with-deps chromium >/dev/null
      - name: Test all five models, rigid recovery, lazy interiors and phone layouts
        env:
          FLEET_ROOT: ${{ github.workspace }}/atlas_fleet_v1
          REVIEW_DIR: /tmp/atlasfleet/review
        run: |
          mkdir -p /tmp/atlasfleet/review
          python -m http.server 8811 --bind 127.0.0.1 --directory atlas_fleet_v1/site >/tmp/atlasfleet/http.log 2>&1 &
          sleep 2
          python atlas_fleet_v1/source/verify.py
      - name: Publish reviewed separate fleet
        id: release
        if: contains(github.event.head_commit.message, '[publish]')
        run: |
          mkdir -p atlas_fleet_v1/live
          cp -R atlas_fleet_v1/site/. atlas_fleet_v1/live/
          cp /tmp/atlasfleet/review/validation.json atlas_fleet_v1/live/browser_validation.json
          git config user.name 'ATLAS release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas_fleet_v1/live
          git commit -m 'Publish ATLAS Fleet 01 with separate vessels and rigid T-top fishing tender'
          git stash push -u -m fleet-generated-assets
          git pull --rebase origin main
          git push origin HEAD:main
          git stash pop || true
          echo "url=https://rawcdn.githack.com/owensto/helper/$(git rev-parse HEAD)/atlas_fleet_v1/live/index.html" >> "$GITHUB_OUTPUT"
      - name: Verify all five entries on the exact public URL
        if: steps.release.outputs.url != ''
        env:
          FLEET_ROOT: ${{ github.workspace }}/atlas_fleet_v1
          BASE_URL: ${{ steps.release.outputs.url }}
          REVIEW_DIR: /tmp/atlasfleet/public
        run: python atlas_fleet_v1/source/verify.py
      - name: Record verified public release evidence
        if: steps.release.outputs.url != ''
        run: |
          cp /tmp/atlasfleet/public/validation.json atlas_fleet_v1/release_validation.json
          git add atlas_fleet_v1/release_validation.json
          git commit -m 'Record public fleet viewer checks, not engineering qualification'
          git stash push -u -m fleet-generated-evidence
          git pull --rebase origin main
          git push origin HEAD:main
          git stash pop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Fleet-01-Native-Models-and-Viewer
          path: |
            /tmp/atlasfleet/
            atlas_fleet_v1/models/
            atlas_fleet_v1/site/
            atlas_fleet_v1/source/
          retention-days: 30

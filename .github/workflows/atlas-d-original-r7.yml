name: ATLAS D original concept R7
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_d_original_r7/source/**'
      - 'atlas_d_original_r7/site/index.html'
      - 'atlas_d_original_r7/site/style.css'
      - 'atlas_d_original_r7/site/viewer.js'
      - 'atlas_d_original_r7/REVIEW.md'
      - '.github/workflows/atlas-d-original-r7.yml'
permissions:
  contents: write
concurrency:
  group: atlas-d-original-r7
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build full model and rigid animation
        run: |
          python -m pip install -q numpy==2.3.5 trimesh==4.11.1 scipy networkx shapely playwright==1.55.0
          cp atlas_d_continuous/live/runtime.js atlas_d_original_r7/site/runtime.js
          cp atlas_d_continuous/live/THIRD_PARTY_LICENSE.txt atlas_d_original_r7/site/THIRD_PARTY_LICENSE.txt
          python atlas_d_original_r7/patches/refine.py
          ATLAS_ROOT="$PWD/atlas_d_original_r7" ATLAS_SOURCE="$PWD/atlas_d_reconstruction/live/ATLAS_D_Reconstruction.glb" python atlas_d_original_r7/source/build.py
      - name: Install browser
        run: python -m playwright install --with-deps chromium >/dev/null
      - name: Capture matching views and test actual animated geometry
        run: |
          mkdir -p /tmp/atlas7/review
          python -m http.server 8787 --bind 127.0.0.1 --directory atlas_d_original_r7/site >/tmp/atlas7/http.log 2>&1 &
          sleep 2
          python atlas_d_original_r7/source/verify.py
      - name: Save editable Blender model
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 >/dev/null
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH ATLAS_ROOT="$PWD/atlas_d_original_r7" LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/blender -b --python-exit-code 1 --python atlas_d_original_r7/source/native.py
          test -s /tmp/atlas7/native/ATLAS_D_Original_Concept_R7.blend
      - name: Publish reviewed separate concept
        id: release
        if: contains(github.event.head_commit.message, '[publish]')
        run: |
          mkdir -p atlas_d_original_r7/live
          cp -R atlas_d_original_r7/site/. atlas_d_original_r7/live/
          cp /tmp/atlas7/review/validation.json atlas_d_original_r7/live/browser_validation.json
          git config user.name 'ATLAS release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas_d_original_r7/live
          git commit -m 'Publish original-concept R7 yacht and complete tender recovery'
          git stash push -u -m generated-build-files
          git pull --rebase origin main
          git push origin HEAD:main
          git stash pop || true
          echo "url=https://rawcdn.githack.com/owensto/helper/$(git rev-parse HEAD)/atlas_d_original_r7/live/index.html" >> "$GITHUB_OUTPUT"
      - name: Verify exact public viewer
        if: steps.release.outputs.url != ''
        env:
          BASE_URL: ${{ steps.release.outputs.url }}
          REVIEW_DIR: /tmp/atlas7/public
        run: python atlas_d_original_r7/source/verify.py
      - name: Preserve public verification
        if: steps.release.outputs.url != ''
        run: |
          cp /tmp/atlas7/public/validation.json atlas_d_original_r7/release_validation.json
          git add atlas_d_original_r7/release_validation.json
          git commit -m 'Record public original-concept animation verification'
          git stash push -u -m generated-review-files
          git pull --rebase origin main
          git push origin HEAD:main
          git stash pop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-D-Original-R7-Model-and-Review
          path: |
            /tmp/atlas7/
            atlas_d_original_r7/site/
            atlas_d_original_r7/source/
          retention-days: 30

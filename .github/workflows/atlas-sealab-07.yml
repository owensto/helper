name: ATLAS Sea Lab 07 review
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_sealab_07/transport/**'
      - 'atlas_sealab_07/review_fixups.py'
      - '.github/workflows/atlas-sealab-07.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-sealab-07-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SEA_ROOT: ${{ github.workspace }}/atlas_sealab_07
      COMMAND_ROOT: ${{ github.workspace }}/atlas_sealab_07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38763415683
          artifact-ids: 11988335475
          path: /tmp/sea07/base
          merge-multiple: true
      - name: Restore reviewed geometry and checksum-verified new source
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,shutil,base64,lzma,json,hashlib
          r=Path(os.environ['SEA_ROOT']);a=Path('/tmp/sea07/base')
          src=next(a.rglob('site/refinement06.js')).parent.parent
          for name in ['site','models','source']:
              shutil.copytree(src/name,r/name,dirs_exist_ok=True)
          data=base64.b64decode(''.join((r/'transport'/f'part{i}.b64').read_text().strip() for i in range(2)),validate=True)
          assert hashlib.sha256(data).hexdigest()=='6409bac06bac6a366e6fdadd58f47c00a139dfa51cd6ddeded36524dc8d7e6e9','Source checksum mismatch'
          for name,text in json.loads(lzma.decompress(data)).items():
              assert Path(name).name==name and name.endswith(('.py','.js','.css'))
              (r/name).write_text(text)
          shutil.copy2(r/'site/assets/ATLAS_Bay_Play.glb',r/'base.glb')
          p=r/'native07.py';s=p.read_text();s=s.replace('bpy.ops.wm.save_as_mainfile(', 'bpy.ops.file.pack_all()\nbpy.ops.wm.save_as_mainfile(');p.write_text(s)
          PY
      - name: Prepare radio, original music, and fitted deck-riser closure
        run: |
          python -m pip install -q numpy==2.3.5 scipy trimesh==4.11.1 networkx pillow playwright==1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy ffmpeg libegl1 >/dev/null
          python "$SEA_ROOT/patch07.py"
          python "$SEA_ROOT/geometry07.py"
          python "$SEA_ROOT/music07.py"
          if [ -f "$SEA_ROOT/review_fixups.py" ]; then python "$SEA_ROOT/review_fixups.py"; fi
          for f in "$SEA_ROOT/site/"*.js; do node --check "$f"; done
      - name: Save native editable scene and verify preserved assemblies
        run: |
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/blender -b --python-exit-code 1 --python "$SEA_ROOT/native07.py"
          python "$SEA_ROOT/audit06.py"
          mkdir -p /tmp/sea07/review
          node "$SEA_ROOT/source/test_command.js" > /tmp/sea07/review/motion_tests.json
          node "$SEA_ROOT/speed_tests07.js" > /tmp/sea07/review/speed_tests07.json
      - name: Test real cockpit, speed, audio, radio and mobile controls
        run: |
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8897 --bind 127.0.0.1 --directory "$SEA_ROOT/site" >/tmp/sea07/http.log 2>&1 &
          sleep 2
          BASE_URL=http://127.0.0.1:8897/index.html REVIEW_DIR=/tmp/sea07/review RADIO_TEST_FILE="$SEA_ROOT/site/assets/audio/lowcountry_drift.ogg" python "$SEA_ROOT/verify07.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-SeaLab07-Review
          path: |
            /tmp/sea07/review/
            /tmp/sea07/http.log
            atlas_sealab_07/site/
            atlas_sealab_07/models/ATLAS_Bay_SeaLab07.blend
            atlas_sealab_07/source/
            atlas_sealab_07/*.py
            atlas_sealab_07/*.js
            atlas_sealab_07/*.css
          retention-days: 30

name: ATLAS Fleet public verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_fleet_v1/verify_public.py'
      - '.github/workflows/atlas-fleet-verify-public.yml'
permissions:
  contents: write
concurrency:
  group: atlas-fleet-public-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
      - name: Verify immutable public release and preserve diagnostics
        env:
          REVIEW_DIR: /tmp/fleet-public
          BASE_URL: https://rawcdn.githack.com/owensto/helper/414020893caab650676425147dd345ce92a923cf/atlas_fleet_v1/live/index.html
        run: python atlas_fleet_v1/verify_public.py
      - name: Record verified public release
        run: |
          cp /tmp/fleet-public/validation.json atlas_fleet_v1/release_validation.json
          git config user.name 'ATLAS release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas_fleet_v1/release_validation.json
          git commit -m 'Record public fleet review verification with startup diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Fleet-01-Public-Verification
          path: /tmp/fleet-public/
          retention-days: 30

name: Publish reviewed Bay Studio 07
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atlas-bay-studio-07-publish.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: atlas-bay-studio-07-release
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11783783140'
          run-id: '38333829721'
          github-token: ${{ github.token }}
          path: /tmp/bay07-reviewed
          merge-multiple: true
      - name: Preserve reviewed geometry and use event-based playback verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json,hashlib
          source=Path('/tmp/bay07-reviewed/home/runner/work/helper/helper/atlas_bay_studio_07')
          root=Path('atlas_bay_studio_07');dest=root/'live'
          report=json.loads((source/'site/bay07_report.json').read_text())
          assert all(v<1e-5 for item in report['native_preservation'].values() for v in item.values())
          assert len(report['unchanged_fleet'])==6
          shutil.copytree(source/'site',dest,dirs_exist_ok=True)
          code=(source/'verify07.py').read_text()
          old="page.wait_for_timeout(700);assert page.evaluate('FLEET.progress')>0"
          assert code.count(old)==1,'Playback-test anchor changed'
          code=code.replace(old,"page.wait_for_function('FLEET.progress>0.00001',timeout=20000)")
          (root/'verify_release07.py').write_text(code)
          report['source_review_run']=38333829721
          report['source_review_artifact']=11783783140
          report['verification_method']='Wait for actual playback progress instead of assuming it occurs within 700 ms on software rendering. All motion, preservation, comparison, loading and error assertions retained.'
          report['asset_sha256']={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in (dest/'assets').glob('*.glb')}
          (dest/'bay07_report.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Test all entries before publishing
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
          mkdir -p /tmp/bay07-final/local /tmp/bay07-final/public
          python -m http.server 8837 --bind 127.0.0.1 --directory atlas_bay_studio_07/live >/tmp/bay07-final/http.log 2>&1 &
          sleep 2
          BASE_URL=http://127.0.0.1:8837/index.html REVIEW_DIR=/tmp/bay07-final/local python atlas_bay_studio_07/verify_release07.py
      - name: Publish separate Studio 07
        id: release
        run: |
          cp /tmp/bay07-final/local/validation.json atlas_bay_studio_07/live/browser_validation.json
          git config user.name 'ATLAS release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f atlas_bay_studio_07/live atlas_bay_studio_07/verify_release07.py
          git commit -m 'Publish Studio 07: sculpted 300-class Bay with GPS and six rod holders'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "url=https://rawcdn.githack.com/owensto/helper/$(git rev-parse HEAD)/atlas_bay_studio_07/live/index.html" >> "$GITHUB_OUTPUT"
      - name: Verify exact public viewer with all required assets
        env:
          BASE_URL: ${{ steps.release.outputs.url }}
          REVIEW_DIR: /tmp/bay07-final/public
        run: python atlas_bay_studio_07/verify_release07.py
      - name: Preserve actual public evidence
        run: |
          cp /tmp/bay07-final/public/validation.json atlas_bay_studio_07/online_validation.json
          git add atlas_bay_studio_07/online_validation.json
          git commit -m 'Record Studio 07 exact public viewer verification'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Bay-Studio-07-Public-Evidence
          path: /tmp/bay07-final/
          retention-days: 30

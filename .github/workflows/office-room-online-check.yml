name: Check public office viewer
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/office-room-online-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - run: python -m pip install -q playwright==1.55.0
      - name: Inspect live rendering
        run: |
          mkdir -p review
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json,shutil
          url='https://rawcdn.githack.com/owensto/helper/821968d650542d4754caf725f96c1621b9bc7608/office_room_studio/site/index.html'
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path=shutil.which('google-chrome'),headless=True,args=['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=b.new_page(viewport={'width':1440,'height':960});errs=[];logs=[];net=[]
              page.on('pageerror',lambda x:errs.append(str(x)))
              page.on('console',lambda x:logs.append([x.type,x.text]))
              page.on('response',lambda r:net.append([r.status,r.url,r.headers.get('content-type','')]))
              page.on('requestfailed',lambda r:net.append(['failed',r.url,r.failure]))
              try:
                  page.goto(url,wait_until='load',timeout=60000)
                  page.wait_for_timeout(12000)
                  page.screenshot(path='review/live.png')
                  result={'url':page.url,'errors':errs,'logs':logs,'network':net,'body':page.locator('body').inner_text()[:1800],'state':page.evaluate('window.ROOM_STUDIO ? ({ready:ROOM_STUDIO.ready,yachtLoaded:ROOM_STUDIO.yachtLoaded,error:ROOM_STUDIO.error}):null')}
                  print(json.dumps(result,indent=2))
                  open('review/diagnostics.json','w').write(json.dumps(result,indent=2))
              finally:b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-public-inspection
          path: review/
          retention-days: 7

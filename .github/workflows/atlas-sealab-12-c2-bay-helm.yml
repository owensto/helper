name: ATLAS CORE settlement and station assessment
on:
  workflow_dispatch:
  push:
    branches: ['atlas/core-c2-bay-helm-20261016']
    paths:
      - 'atlas_sealab_12/integration/c2-bay-helm/bolster-state.js'
      - 'atlas_sealab_12/integration/c2-bay-helm/evidence/settlement-02/*.py'
      - 'atlas_sealab_12/integration/c2-bay-helm/evidence/settlement-02/test.cjs'
      - 'atlas_sealab_12/integration/c2-bay-helm/evidence/settlement-02/policy.json'
      - '.github/workflows/atlas-sealab-12-c2-bay-helm.yml'
permissions:
  contents: read
concurrency:
  group: atlas-c2-bay-helm-review
  cancel-in-progress: true
jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      TEST_DEVICE: ${{ matrix.device }}
      C2_OUT: /tmp/atlas-c2-bay-helm
      REVIEW_DIR: /tmp/atlas-c2-bay-helm/review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Guard isolated ownership and exact host; execute source geometry and clock tests
        run: |
          test "${GITHUB_REF_NAME}" = "atlas/core-c2-bay-helm-20261016"
          python - <<'PYGATE'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','36903985f2182c902427fed77d4e28c61a7639ca','HEAD'],text=True).splitlines()
          assert paths and all(p.startswith('atlas_sealab_12/integration/c2-bay-helm/') or p=='.github/workflows/atlas-sealab-12-c2-bay-helm.yml' for p in paths),paths
          PYGATE
          python - <<'PYNARROW'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','f560ee69dc9bd766bd024c7571f866230445a790','HEAD'],text=True).splitlines()
          assert all(p=='atlas_sealab_12/integration/c2-bay-helm/bolster-state.js' or p.startswith('atlas_sealab_12/integration/c2-bay-helm/evidence/settlement-02/') or p=='.github/workflows/atlas-sealab-12-c2-bay-helm.yml' for p in paths),paths
          PYNARROW
          export GITHUB_SHA=f641b5f2eaf2305e9c86b851843304260a811078
          python atlas_sealab_12/integration/c2-bay-helm/prepare.py
          for f in "$C2_OUT/site/"*.js; do node --check "$f"; done
          node atlas_sealab_12/integration/c2-bay-helm/evidence/skin-matrix-probe.cjs > "$C2_OUT/skin-matrix-probe.json"
          node atlas_sealab_12/integration/c2-bay-helm/test-receiver.cjs > "$C2_OUT/unit.stdout"
          if C2_REQUIRE_HUMAN=1 python atlas_sealab_12/integration/c2-bay-helm/prepare.py >"$C2_OUT/positive-gate.log" 2>&1; then
            echo 'Ungated human activation was accepted'; exit 1
          fi
          grep -q IMMUTABLE_HUMANS_SOURCE_REQUIRED "$C2_OUT/positive-gate.log"
      - name: Require corrected HUMANS and non-vacuous CORE closure preflight before scoped candidate build
        run: |
          export GITHUB_SHA=f641b5f2eaf2305e9c86b851843304260a811078
          mkdir -p /tmp/c2-owner
          git archive 10ed9c2f8d0c392828f238e686bcc689517d34f9 atlas_humans atlas_d_original_r7/live/ATLAS_D_Original.glb | tar -x -C /tmp/c2-owner
          python - <<'PYOWNER'
          from pathlib import Path
          import hashlib,json,os,shutil
          r=Path('/tmp/c2-owner/atlas_humans');out=Path(os.environ['C2_OUT'])
          digest=hashlib.sha256((r/'profiles/bay12/profile.json').read_bytes()).hexdigest()
          assert digest=='2d8f1b640ac9ffad745e889984b264d55531b72d7f0496e611be4ca1ca824902'
          profile=json.loads((r/'profiles/bay12/profile.json').read_text());assert profile['productionEnabled'] is False
          hashes={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in r.rglob('*') if p.is_file()}
          (out/'human-input-hashes.json').write_text(json.dumps({'sourceSHA':'10ed9c2f8d0c392828f238e686bcc689517d34f9','profileSHA256':digest,'activated':False,'hashes':hashes},indent=2))
          for name in ['src','profiles','assets','tests','tools']:
              shutil.copytree(r/name,out/'owner-source'/name,dirs_exist_ok=True)
          for p in r.iterdir():
              if p.is_file():shutil.copy2(p,out/'owner-source'/p.name)
          PYOWNER
          npm ci --prefix /tmp/c2-owner/atlas_humans --ignore-scripts --no-fund --no-audit > "$C2_OUT/human-install.log" 2>&1
          GIT_DIR="$GITHUB_WORKSPACE/.git" npm test --prefix /tmp/c2-owner/atlas_humans > "$C2_OUT/human-unit.txt" 2>&1
          C2_HUMAN_DIR=/tmp/c2-owner/atlas_humans node atlas_sealab_12/integration/c2-bay-helm/test-receiver.cjs > "$C2_OUT/closure-unit.stdout"
          C2_REQUIRE_HUMAN=1 C2_HUMAN_DIR=/tmp/c2-owner/atlas_humans python atlas_sealab_12/integration/c2-bay-helm/prepare.py
          for f in "$C2_OUT/site/"*.js "$C2_OUT/site/human/src/"*.mjs; do node --check "$f"; done
      - name: Build separately hashed endpoint candidate and run pure boundary tests
        run: |
          GITHUB_SHA=f560ee69dc9bd766bd024c7571f866230445a790 python atlas_sealab_12/integration/c2-bay-helm/evidence/occupancy-01/prepare.py test
          GITHUB_SHA=f560ee69dc9bd766bd024c7571f866230445a790 python atlas_sealab_12/integration/c2-bay-helm/evidence/occupancy-01/prepare.py snapshot
          python atlas_sealab_12/integration/c2-bay-helm/evidence/settlement-02/prepare.py
          node atlas_sealab_12/integration/c2-bay-helm/evidence/settlement-02/test.cjs > "$C2_OUT/settlement-unit.json"
          for f in "$C2_OUT/settlement-site/"*.js; do node --check "$f"; done
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8938 --bind 127.0.0.1 --directory "$C2_OUT/settlement-site" >"$C2_OUT/settlement-http.log" 2>&1 &
          sleep 1
      - name: Full existing-host H4 diagnostic regressions on new candidate
        id: regression
        continue-on-error: true
        run: |
          BASE_URL=http://127.0.0.1:8938/index.html python "$C2_OUT/verify-settlement-regression.py"
      - name: Actual endpoint approach return paused motion and threshold captures
        if: always()
        id: settlement
        continue-on-error: true
        run: |
          python atlas_sealab_12/integration/c2-bay-helm/evidence/settlement-02/verify.py
      - name: One source-bound mechanical and support feasibility assessment
        if: always()
        id: feasibility
        continue-on-error: true
        run: |
          python atlas_sealab_12/integration/c2-bay-helm/evidence/settlement-02/feasibility.py
      - name: Preserve all outcomes without inferring gameplay acceptance
        if: always()
        env:
          REGRESSION: ${{ steps.regression.outcome }}
          SETTLEMENT: ${{ steps.settlement.outcome }}
          FEASIBILITY: ${{ steps.feasibility.outcome }}
        run: |
          python - <<'PYRESULT'
          from pathlib import Path
          import os,json
          p=Path(os.environ['C2_OUT']);p.mkdir(exist_ok=True)
          d={'sourceSHA':os.environ['GITHUB_SHA'],'regression':os.environ['REGRESSION'],'settlement':os.environ['SETTLEMENT'],'feasibilityAssessment':os.environ['FEASIBILITY'],'publicActivation':False,'fullBodyAccepted':False,'feasibleStationApproved':False}
          (p/'iteration-outcomes.json').write_text(json.dumps(d,indent=2))
          assert all(d[k]=='success' for k in ['regression','settlement','feasibilityAssessment']),d
          PYRESULT
      - name: Preserve exact source and archive manifest, including failures
        if: always()
        run: |
          mkdir -p "$C2_OUT/source"
          cp atlas_sealab_12/integration/c2-bay-helm/*.* "$C2_OUT/source/"
          cp -r atlas_sealab_12/integration/c2-bay-helm/evidence/settlement-02 "$C2_OUT/source/"
          cp .github/workflows/atlas-sealab-12-c2-bay-helm.yml "$C2_OUT/source/"
          printf '%s\n' "$GITHUB_SHA" > "$C2_OUT/source-sha.txt"
          python - <<'PYHASH'
          from pathlib import Path
          import hashlib,json,os
          r=Path(os.environ['C2_OUT']);d={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file() and not any(x.startswith('.') for x in p.relative_to(r).parts)}
          (r/'artifact-hashes.json').write_text(json.dumps(d,indent=2))
          PYHASH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-CORE-Settlement02-${{ matrix.device }}
          path: /tmp/atlas-c2-bay-helm/
          retention-days: 30

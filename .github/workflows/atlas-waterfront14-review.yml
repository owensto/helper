name: ATLAS Waterfront14 integrated review
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_sealab_14/transport/**'
      - 'atlas_sealab_14/fixups14.py'
      - '.github/workflows/atlas-waterfront14-review.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-waterfront14-review
  cancel-in-progress: true
jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_DEVICE: ${{ matrix.device }}
      BASE13: ${{ github.workspace }}/atlas_sealab_13/live
      SITE14: ${{ github.workspace }}/atlas_sealab_14/site
      REVIEW_DIR: ${{ github.workspace }}/atlas_sealab_14/review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39003347649
          artifact-ids: 12089444636
          path: /tmp/waterfront14-data
          merge-multiple: true
      - name: Verify exact source and prepare integrated application
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib,shutil
          r=Path('atlas_sealab_14');data=base64.b64decode(''.join((r/'transport'/f'part{i}.b64').read_text().strip() for i in range(2)),validate=True)
          assert hashlib.sha256(data).hexdigest()=='c89e1e7774e2831d0c2c0dfaf932197a1753996293280bff856bef228568b155','Source checksum mismatch'
          for name,text in json.loads(lzma.decompress(data)).items():
              p=Path(name);assert len(p.parts)==1 and p.suffix in ['.md','.cjs','.js','.css','.py']
              dest=r/'source'/p;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(text)
          shutil.copytree('/tmp/waterfront14-data',r/'provenance',dirs_exist_ok=True)
          PY
          python atlas_sealab_14/fixups14.py
          python atlas_sealab_14/source/patch14.py
          cp /tmp/waterfront14-data/terrain14.i16.gz /tmp/waterfront14-data/terrain14.json /tmp/waterfront14-data/waterfront_osm14.json /tmp/waterfront14-data/acquisition.json "$SITE14/assets/"
          mkdir -p "$REVIEW_DIR"
          node --max-old-space-size=4096 atlas_sealab_14/source/bake14.cjs "$SITE14" > "$REVIEW_DIR/bake14.json"
          node atlas_sealab_14/source/finalize14.cjs "$SITE14" > "$REVIEW_DIR/launch-tile.json"
          for f in "$SITE14/"*.js; do node --check "$f"; done
          node atlas_sealab_14/source/test14.cjs "$SITE14" "$BASE13" > "$REVIEW_DIR/physics14.json"
      - name: Real browser geometry tide handling and mobile controls
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8914 --bind 127.0.0.1 --directory "$SITE14" >"$REVIEW_DIR/http.log" 2>&1 &
          sleep 2
          BASE_URL=http://127.0.0.1:8914/index.html python atlas_sealab_14/source/verify14.py
      - name: Preserve exact candidate identity and failures
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          r=Path('atlas_sealab_14');h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          files={str(p.relative_to(r/'site')):h(p) for p in sorted((r/'site').rglob('*')) if p.is_file()}
          d={'source_commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'device':os.environ['TEST_DEVICE'],'basePublic':'491fbb0133fde085c03e4ee93db34f4e630a3c42','files':files,'fingerprint':hashlib.sha256(json.dumps(files,sort_keys=True,separators=(',',':')).encode()).hexdigest()}
          (r/'candidate.json').write_text(json.dumps(d,indent=2))
          assert not any(p.suffix.lower() in ['.ttf','.otf','.woff','.woff2'] for p in r.rglob('*'))
          (r/'artifact-manifest.json').write_text(json.dumps({str(p.relative_to(r)):h(p) for p in sorted(r.rglob('*')) if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Waterfront14-${{ matrix.device }}
          path: atlas_sealab_14/
          retention-days: 30

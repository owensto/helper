name: Bay Play 02 portable review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atlas-bay-play-02-portable.yml'
      - 'atlas_bay_play_release_02/PORTABLE_REVIEW.md'
permissions:
  contents: read
concurrency:
  group: atlas-bay-play02-portable
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      BAY_ROOT: ${{ github.workspace }}/atlas_bay_play_release_02
    steps:
      - name: Confirm runner execution
        run: date -u
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore exact source and baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib
          r=Path('atlas_bay_play_release_02')
          b=base64.b64decode(''.join((r/'transport'/f'part{i}.b64').read_text().strip() for i in range(3)),validate=True)
          assert hashlib.sha256(b).hexdigest()=='6207e2177098de2d64761ea351c3b80e233dfaab136a3c38ee5668ba59c1b0b3'
          for name,text in json.loads(lzma.decompress(b)).items():
              p=Path(name);assert p.parts[0] in ('site','source') and '..' not in p.parts
              o=r/p;o.parent.mkdir(parents=True,exist_ok=True);o.write_text(text)
          PY
          git fetch --no-tags origin eb2f86fcf96372fc236d974d647b99139ae057a2
          mkdir -p /tmp/bayplay02/base /tmp/bayplay02/review "$BAY_ROOT/site/assets" "$BAY_ROOT/models"
          git archive eb2f86fcf96372fc236d974d647b99139ae057a2 atlas_bay_play_release_01/live atlas_bay_studio_04/source | tar -x -C /tmp/bayplay02/base
          cp /tmp/bayplay02/base/atlas_bay_play_release_01/live/runtime.js /tmp/bayplay02/base/atlas_bay_play_release_01/live/THIRD_PARTY_LICENSE.txt "$BAY_ROOT/site/"
          cp -R /tmp/bayplay02/base/atlas_bay_play_release_01/live/assets/. "$BAY_ROOT/site/assets/"
          cp "$BAY_ROOT/site/assets/ATLAS_Bay_Play.glb" "$BAY_ROOT/base.glb"
          cp -R /tmp/bayplay02/base/atlas_bay_studio_04/source "$BAY_ROOT/helpers"
          python "$BAY_ROOT/fixups.py"
      - name: Build and test game-model source
        run: |
          python -m pip install -q numpy==2.3.5 trimesh==4.11.1 scipy shapely networkx pillow matplotlib playwright==1.55.0
          python "$BAY_ROOT/source/build02.py"
          for f in app physics coast sound; do node --check "$BAY_ROOT/site/$f.js"; done
          node "$BAY_ROOT/source/test_motion.js" > /tmp/bayplay02/review/motion_tests.json
      - name: Native export with pinned Blender 4.0.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxi6 libxrender1 libxfixes3 libgl1 libsm6 >/dev/null
          curl -fL --retry 2 --max-time 180 https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH LIBGL_ALWAYS_SOFTWARE=1 /tmp/blender-4.0.2-linux-x64/blender -b --python-exit-code 1 --python "$BAY_ROOT/source/native02.py"
          python "$BAY_ROOT/source/audit02.py"
      - name: Actual desktop and phone-sized browser review
        run: |
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8862 --bind 127.0.0.1 --directory "$BAY_ROOT/site" >/tmp/bayplay02/http.log 2>&1 &
          sleep 2
          BASE_URL=http://127.0.0.1:8862/index.html REVIEW_DIR=/tmp/bayplay02/review python "$BAY_ROOT/source/verify02.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Bay-PlayLab-02-Portable-Review
          path: |
            /tmp/bayplay02/review/
            /tmp/bayplay02/http.log
            atlas_bay_play_release_02/site/
            atlas_bay_play_release_02/models/
            atlas_bay_play_release_02/source/
            atlas_bay_play_release_02/helpers/
          retention-days: 30

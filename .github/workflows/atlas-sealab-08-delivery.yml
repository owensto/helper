name: ATLAS Sea Lab 08 final public delivery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atlas-sealab-08-delivery.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-sealab-08-final-public-check
  cancel-in-progress: true
env:
  PUBLIC_COMMIT: ca5d6bcd518d3be39dad9fff6f3841f8d72acb1a
  BASE_URL: https://rawcdn.githack.com/owensto/helper/ca5d6bcd518d3be39dad9fff6f3841f8d72acb1a/atlas_sealab_08/live/index.html
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DEVICE: ${{ matrix.device }}
      REVIEW_DIR: /tmp/delivery08
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca5d6bcd518d3be39dad9fff6f3841f8d72acb1a
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve full regression results and require CSS-only final delta
        run: |
          test "$(git diff HEAD^ HEAD --name-only)" = "atlas_sealab_08/live/realism08.css"
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('atlas_sealab_08');d=json.loads((r/'live/browser_validation.json').read_text())
          assert d['passed'] and {x['device'] for x in d['tests'] if x['passed']}=={'desktop','phone'}
          p=r/'verify_public_release08.py';s=p.read_text();needle="   r['scroll_width']=page.evaluate('document.documentElement.scrollWidth');"
          extra="""   if dev=='phone':
              assert page.locator('#cruise-rail').is_hidden(),'Duplicate mobile driving rail'
              # Fixed-position children do not give their wrapper a bounding box.
              # Test and click the actual controls, not the zero-height wrapper.
              assert page.locator('#touch-neutral').is_visible() and page.locator('#touch-throttle').is_visible(),'Touch controls must remain reachable'
              r['phone_clear_layout']=page.evaluate('''() => {const ids=['speed-hud','sea08-compass','sea08-pause'];const boxes=ids.map(id=>{const r=document.getElementById(id).getBoundingClientRect();return {id,x:r.x,y:r.y,width:r.width,height:r.height};});let overlaps=[];for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){const a=boxes[i],b=boxes[j];if(a.x<b.x+b.width&&b.x<a.x+a.width&&a.y<b.y+b.height&&b.y<a.y+a.height)overlaps.push([a.id,b.id]);}return {boxes,overlaps};}''')
              assert not r['phone_clear_layout']['overlaps'],r['phone_clear_layout']
              page.locator('#touch-neutral').click();assert page.evaluate('BAYPLAY.state.gear===0')
          """
          assert needle in s;s=s.replace(needle,extra+needle);p.write_text(s)
          PY
          python -m py_compile atlas_sealab_08/verify_public_release08.py
      - name: Test actual public assets, recorded engine audio, radio and clean cockpit
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
          python atlas_sealab_08/verify_public_release08.py
          cp atlas_sealab_08/verify_public_release08.py /tmp/delivery08/verify_public_release08.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-SeaLab08-Delivery-${{ matrix.device }}
          path: /tmp/delivery08/
          retention-days: 30
  record:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ATLAS-SeaLab08-Delivery-*
          path: /tmp/delivery08-all
      - name: Record the exact verified final link and reports
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,shutil
          root=Path('/tmp/delivery08-all');reports=[json.loads(p.read_text()) for p in root.rglob('validation.json')]
          assert len(reports)==2 and all(d['passed'] for d in reports)
          d={**reports[0],'tests':[t for r in reports for t in r['tests']],'published_commit':os.environ['PUBLIC_COMMIT'],'full_regression_run':38812973288,'final_delta':'CSS-only mobile HUD separation and duplicate-rail removal; public playback and control tests rerun on both layouts'}
          assert {t['device'] for t in d['tests']}=={'desktop','phone'}
          Path('atlas_sealab_08/online_final08.json').write_text(json.dumps(d,indent=2))
          (root/'delivery.json').write_text(json.dumps({'url':d['url'],'commit':d['published_commit'],'public_test_passed':True,'full_regression_run':38812973288},indent=2))
          PY
          git config user.name 'ATLAS release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas_sealab_08/online_final08.json
          git commit -m 'Verify final Sea Lab 08 public delivery with non-overlapping phone cockpit'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-SeaLab08-Delivery-Combined
          path: /tmp/delivery08-all/
          retention-days: 30

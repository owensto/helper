name: ATLAS Bay Play Release 01
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_bay_play_release_01/stabilize.py'
      - 'atlas_bay_play_release_01/finish_ui.py'
      - 'atlas_bay_play_release_01/verify.py'
      - 'atlas_bay_play_release_01/REVIEW.md'
      - '.github/workflows/atlas-bay-play-release-01.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: atlas-bay-play-release-01
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BAY_ROOT: ${{ github.workspace }}/atlas_bay_play_release_01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38443814429
          artifact-ids: 11836917713
          path: /tmp/bayplay11/recovered
          merge-multiple: true
      - name: Preserve native model and repair interactive runtime
        run: |
          python - <<'PY'
          import os,shutil,hashlib,json
          from pathlib import Path
          r=Path(os.environ['BAY_ROOT']);a=Path('/tmp/bayplay11/recovered')
          src=next(a.rglob('site/app.js')).parent.parent
          for name in ['site','src','models']:
              shutil.copytree(src/name,r/name,dirs_exist_ok=True)
          h=hashlib.sha256((r/'site/assets/ATLAS_Bay_Play.glb').read_bytes()).hexdigest()
          (r/'preserved_model.json').write_text(json.dumps({'source_run':38443814429,'sha256':h}))
          PY
          python "$BAY_ROOT/stabilize.py"
          python "$BAY_ROOT/finish_ui.py"
          node --check "$BAY_ROOT/site/app.js"
          node - <<'JS'
          const B=require(process.env.BAY_ROOT+'/site/physics.js'),a=require('assert');
          const b=new B();b.engine=true;b.gear=1;b.throttle=.55;for(let i=0;i<600;i++)b.step(1/60);a(b.x>20&&b.u>1);b.steer=.6;for(let i=0;i<300;i++)b.step(1/60);a(b.heading>.1);b.stop();b.gear=-1;b.throttle=.45;for(let i=0;i<300;i++)b.step(1/60);a(b.u<-.6);b.reset();b.x=0;b.z=-4;b.heading=-Math.PI/2;b.engine=true;b.gear=1;b.throttle=1;let c=false;for(let i=0;i<900;i++){b.step(1/60,[{x0:-27,x1:22,z0:-9.7,z1:-6}]);c=c||b.contact;}a(c&&b.z>-6);console.log('Forward, reverse, turn and contact unit checks passed; uncalibrated.');
          JS
      - name: Test actual interaction and driving controls
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
          mkdir -p /tmp/bayplay11/review
          python -m http.server 8851 --bind 127.0.0.1 --directory "$BAY_ROOT/site" >/tmp/bayplay11/http.log 2>&1 &
          sleep 2
          BASE_URL=http://127.0.0.1:8851/index.html REVIEW_DIR=/tmp/bayplay11/review python "$BAY_ROOT/verify.py"
      - name: Publish separately after visual review
        if: contains(github.event.head_commit.message, '[publish]')
        id: publish
        run: |
          mkdir -p "$BAY_ROOT/live"
          cp -R "$BAY_ROOT/site/." "$BAY_ROOT/live/"
          cp /tmp/bayplay11/review/validation.json "$BAY_ROOT/live/browser_validation.json"
          git config user.name 'ATLAS release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f atlas_bay_play_release_01/live atlas_bay_play_release_01/src atlas_bay_play_release_01/preserved_model.json atlas_bay_play_release_01/verify.py
          git commit -m 'Publish Bay Play Lab: independent lid interaction and real-time driving prototype'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "url=https://rawcdn.githack.com/owensto/helper/$(git rev-parse HEAD)/atlas_bay_play_release_01/live/index.html" >> "$GITHUB_OUTPUT"
      - name: Verify exact public URL
        if: steps.publish.outputs.url != ''
        env:
          BASE_URL: ${{ steps.publish.outputs.url }}
          REVIEW_DIR: /tmp/bayplay11/public
        run: python "$BAY_ROOT/verify.py"
      - name: Preserve public evidence
        if: steps.publish.outputs.url != ''
        run: |
          cp /tmp/bayplay11/public/validation.json "$BAY_ROOT/online_validation.json"
          git add atlas_bay_play_release_01/online_validation.json
          git commit -m 'Record public interaction and driving tests without claiming marine qualification'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Bay-Play-Release-01-Evidence-and-Models
          path: |
            /tmp/bayplay11/review/
            /tmp/bayplay11/public/
            atlas_bay_play_release_01/site/
            atlas_bay_play_release_01/src/
            atlas_bay_play_release_01/models/
            atlas_bay_play_release_01/*.py
          retention-days: 30

name: ATLAS D Y2 isolated physical helm review
on:
  push:
    branches: ['atlas-d/yacht-helm-y2-20261016']
    paths: ['.github/workflows/atlas-d-simulator-01.yml','atlas_d_simulator_01/contact/y2/**']
permissions:
  contents: write
concurrency:
  group: atlas-d-y2-helm-isolated
  cancel-in-progress: true
jobs:
  review:
    if: github.ref == 'refs/heads/atlas-d/yacht-helm-y2-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            atlas_d_simulator_01
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify untouched source and restore immutable receiver inputs
        run: |
          python atlas_d_simulator_01/contact/y2/prepare.py
          npm ci --ignore-scripts --omit=dev --prefix atlas_d_simulator_01/contact/y2/dependencies/humans
          for f in atlas_d_simulator_01/contact/y2/*.js; do node --check "$f"; done
          node atlas_d_simulator_01/contact/y2/test-helm.cjs > atlas_d_simulator_01/contact/y2/evidence/unit.stdout
          node atlas_d_simulator_01/contact/test-attachments.cjs > atlas_d_simulator_01/contact/y2/evidence/y1-tests.json
          node atlas_d_simulator_01/test-core.cjs > atlas_d_simulator_01/contact/y2/evidence/core-regression.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('atlas_d_simulator_01/contact/y2/evidence')
          v=json.loads((p/'unit.json').read_text());assert v['passed'] and v['h2']['actualPinnedReader'] and v['h2']['transformAccepted'] and v['h2']['oldY1RemainsUnavailable']
          assert json.loads((p/'y1-tests.json').read_text())['total']==35
          assert json.loads((p/'core-regression.json').read_text())['total']==22
          PY
      - name: Capture original geometry, normal motion and lifecycle transitions
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8916 --bind 127.0.0.1 --directory . >atlas_d_simulator_01/contact/y2/evidence/http.log 2>&1 &
          sleep 2
          BASE_URL=http://127.0.0.1:8916/atlas_d_simulator_01/contact/y2/preview.html python atlas_d_simulator_01/contact/y2/verify.py
      - name: Record bounded evidence without publishing
        if: always()
        run: |
          mkdir -p atlas_d_simulator_01/contact/y2/evidence
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('atlas_d_simulator_01/contact/y2')
          files={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in r.rglob('*') if p.is_file() and 'dependencies' not in p.parts and p.name!='artifact-manifest.json'}
          (r/'evidence/artifact-manifest.json').write_text(json.dumps({'sourceCommit':'09aeb97168c4cd627cb54766d8f9ef2e55b83183','originalSourceCommit':'48b9bef038ab2e422b6677d7ca9db4879419a3f9','resultSourceCommit':os.environ['GITHUB_SHA'],'branch':os.environ['GITHUB_REF_NAME'],'productionEnabled':False,'integratedRelease':False,'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-D-Y2-physical-helm-review
          path: |
            atlas_d_simulator_01/contact/y2/
            !atlas_d_simulator_01/contact/y2/dependencies/**
          retention-days: 7

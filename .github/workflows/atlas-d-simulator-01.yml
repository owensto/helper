name: ATLAS D Y1 isolated attachment contract review
on:
  push:
    branches: ['atlas-d/yacht-contact-y1-20261016']
    paths: ['.github/workflows/atlas-d-simulator-01.yml','atlas_d_simulator_01/contact/**']
permissions:
  contents: write
concurrency:
  group: atlas-d-y1-contact-isolated
  cancel-in-progress: true
jobs:
  review:
    if: github.ref == 'refs/heads/atlas-d/yacht-contact-y1-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            atlas_d_simulator_01
            .github/workflows/atlas-d-simulator-01.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover exact read-only source and audit existing anchors
        run: |
          mkdir -p /tmp/y1-base atlas_d_simulator_01/contact/evidence
          git fetch --depth=1 origin 48b9bef038ab2e422b6677d7ca9db4879419a3f9
          git archive 48b9bef038ab2e422b6677d7ca9db4879419a3f9 atlas_d_simulator_01/live atlas_d_simulator_01/src atlas_d_simulator_01/test-core.cjs atlas_d_simulator_01/verify.py | tar -x -C /tmp/y1-base
          python -m pip install -q numpy==2.2.6
          python atlas_d_simulator_01/contact/inspect-anchors.py /tmp/y1-base/atlas_d_simulator_01/live/assets/ATLAS_D_Original.glb atlas_d_simulator_01/contact/evidence/anchor-audit.json
          node /tmp/y1-base/atlas_d_simulator_01/test-core.cjs > atlas_d_simulator_01/contact/evidence/core-regression.json
          if [ -f atlas_d_simulator_01/contact/test-attachments.cjs ]; then node atlas_d_simulator_01/contact/test-attachments.cjs; fi
      - name: Archive source evidence without publication
        run: |
          tar -czf atlas_d_simulator_01/contact/evidence/read-only-baseline.tar.gz -C /tmp/y1-base atlas_d_simulator_01
          git diff --name-only > atlas_d_simulator_01/contact/evidence/tracked-diff.txt
          git rev-parse HEAD > atlas_d_simulator_01/contact/evidence/result-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-D-Y1-contact-review
          path: atlas_d_simulator_01/contact/
          retention-days: 7

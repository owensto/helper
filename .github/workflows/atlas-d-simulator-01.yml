name: ATLAS D Y5 isolated same-session rotation review
on:
  push:
    branches: ['atlas-d/yacht-rotation-y5-20261016']
    paths: ['.github/workflows/atlas-d-simulator-01.yml','atlas_d_simulator_01/contact/y5/**']
permissions:
  contents: write
concurrency:
  group: atlas-d-y5-rotation-isolated
  cancel-in-progress: true
jobs:
  review:
    if: github.ref == 'refs/heads/atlas-d/yacht-rotation-y5-20261016'
    strategy:
      fail-fast: false
      matrix:
        layout: [portrait, landscape]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            atlas_d_simulator_01
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve exact Y4 and existing controller/contact regressions
        run: |
          python atlas_d_simulator_01/contact/y5/prepare.py
          npm ci --ignore-scripts --omit=dev --prefix atlas_d_simulator_01/contact/y2/dependencies/humans
          node atlas_d_simulator_01/contact/y4/test-preview.cjs > atlas_d_simulator_01/contact/y5/evidence/y4-tests.json
          node atlas_d_simulator_01/contact/y3/test-wheel.cjs > atlas_d_simulator_01/contact/y5/evidence/y3-tests.json
          node atlas_d_simulator_01/contact/y2/test-helm.cjs > atlas_d_simulator_01/contact/y5/evidence/y2-tests.json
          node atlas_d_simulator_01/contact/test-attachments.cjs > atlas_d_simulator_01/contact/y5/evidence/y1-tests.json
          node atlas_d_simulator_01/test-core.cjs > atlas_d_simulator_01/contact/y5/evidence/core-tests.json
      - name: Reproduce rotation on actual unchanged Y4 with trusted touch
        env:
          LAYOUT: ${{ matrix.layout }}
          ENTRY: y4
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8919 --bind 127.0.0.1 --directory . >atlas_d_simulator_01/contact/y5/evidence/http.log 2>&1 &
          sleep 2
          python atlas_d_simulator_01/contact/y5/verify.py
      - name: Record exact evidence only
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('atlas_d_simulator_01/contact/y5');e=r/'evidence';e.mkdir(exist_ok=True)
          files={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in r.rglob('*') if p.is_file() and p.name!='artifact-manifest.json'}
          (e/'artifact-manifest.json').write_text(json.dumps({'sourceCommit':'e30edc8e33b863f3fafb303be0050cc86b7900f0','resultSourceCommit':os.environ['GITHUB_SHA'],'branch':os.environ['GITHUB_REF_NAME'],'productionEnabled':False,'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-D-Y5-${{ matrix.layout }}-rotation-review
          path: atlas_d_simulator_01/contact/y5/
          retention-days: 7

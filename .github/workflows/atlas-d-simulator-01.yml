name: ATLAS D Y4 isolated phone preview review
on:
  push:
    branches: ['atlas-d/yacht-touch-y4-20261016']
    paths: ['.github/workflows/atlas-d-simulator-01.yml','atlas_d_simulator_01/contact/y4/**']
permissions:
  contents: write
concurrency:
  group: atlas-d-y4-touch-isolated
  cancel-in-progress: true
jobs:
  review:
    if: github.ref == 'refs/heads/atlas-d/yacht-touch-y4-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        layout: [portrait, landscape]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            atlas_d_simulator_01
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve exact Y3 and run unchanged regressions
        run: |
          python atlas_d_simulator_01/contact/y4/prepare.py
          npm ci --ignore-scripts --omit=dev --prefix atlas_d_simulator_01/contact/y2/dependencies/humans
          node --check atlas_d_simulator_01/contact/y4/preview.js
          node atlas_d_simulator_01/contact/y4/test-preview.cjs
          node atlas_d_simulator_01/contact/y3/test-wheel.cjs > atlas_d_simulator_01/contact/y4/evidence/y3-tests.json
          node atlas_d_simulator_01/contact/y2/test-helm.cjs > atlas_d_simulator_01/contact/y4/evidence/y2-tests.json
          node atlas_d_simulator_01/contact/test-attachments.cjs > atlas_d_simulator_01/contact/y4/evidence/y1-tests.json
          node atlas_d_simulator_01/test-core.cjs > atlas_d_simulator_01/contact/y4/evidence/core-tests.json
      - name: Real phone touch before and after including full owner-time lifecycle
        env:
          LAYOUT: '${{ matrix.layout }}'
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8918 --bind 127.0.0.1 --directory . >atlas_d_simulator_01/contact/y4/evidence/http.log 2>&1 &
          sleep 2
          python atlas_d_simulator_01/contact/y4/verify.py
      - name: Hash artifact without publishing or repository writes
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          r=Path('atlas_d_simulator_01/contact/y4');e=r/'evidence';e.mkdir(exist_ok=True)
          files={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in r.rglob('*') if p.is_file() and p.name!='artifact-manifest.json'}
          (e/'artifact-manifest.json').write_text(json.dumps({'sourceCommit':'306525892bb35620184dd52d5679adf578b8f76a','resultSourceCommit':os.environ['GITHUB_SHA'],'branch':os.environ['GITHUB_REF_NAME'],'productionEnabled':False,'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'ATLAS-D-Y4-${{ matrix.layout }}-review'
          path: atlas_d_simulator_01/contact/y4/
          retention-days: 7

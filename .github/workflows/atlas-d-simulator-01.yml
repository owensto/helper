name: ATLAS D SUMARS Y14 navigation and realism
on:
  push:
    branches: ['atlas-d/fleet-navigation-y14-20261023']
    paths:
      - '.github/workflows/atlas-d-simulator-01.yml'
      - 'atlas_d_simulator_01/contact/y14/*.js'
      - 'atlas_d_simulator_01/contact/y14/*.cjs'
      - 'atlas_d_simulator_01/contact/y14/*.py'
      - 'atlas_d_simulator_01/contact/y14/*.html'
      - 'atlas_d_simulator_01/contact/y14/*.css'
permissions:
  contents: write
concurrency:
  group: atlas-d-y14-isolated-publication
  cancel-in-progress: false
jobs:
  verify-publish:
    if: github.ref == 'refs/heads/atlas-d/fleet-navigation-y14-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            atlas_d_simulator_01
            atlas_fleet_atelier_02/live/assets
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Navigation, force model, original geometry and optics checks
        run: |
          cd atlas_d_simulator_01/contact/y14
          mkdir -p evidence
          for f in *.js; do node --check "$f"; done
          node test-navigation.cjs > evidence/navigation.stdout
          node test-simulation.cjs > evidence/simulation.stdout
          node test-realism.cjs > evidence/realism.stdout 2>evidence/realism.stderr
          node ../../test-core.cjs > evidence/unchanged-core.json
          python build.py
      - name: Operate real chart, four craft and depth recovery in browsers
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install chromium >/dev/null
          python -m http.server 8926 --bind 127.0.0.1 --directory . >atlas_d_simulator_01/contact/y14/evidence/http.log 2>&1 &
          sleep 2
          python atlas_d_simulator_01/contact/y14/verify.py
      - name: Publish only gated isolated Y14 app and reproducible measurements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('atlas_d_simulator_01/contact/y14')
          for f in ['evidence/local-browser.json','evidence/navigation-tests.json','evidence/simulation-tests.json','evidence/unit-results.json']:
              assert json.loads((r/f).read_text())['passed'],f
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f atlas_d_simulator_01/contact/y14/build.json atlas_d_simulator_01/contact/y14/measurements.json
          git commit -m 'Publish gated SUMARS navigation and realism candidate'
          git push origin HEAD:refs/heads/atlas-d/fleet-navigation-y14-20261023
          echo "PUBLIC_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PUBLIC_URL=https://rawcdn.githack.com/owensto/helper/$(git rev-parse HEAD)/atlas_d_simulator_01/contact/y14/index.html" >> "$GITHUB_ENV"
      - name: Verify actual public source bytes and trusted four-vessel navigation
        run: |
          python atlas_d_simulator_01/contact/y14/verify.py
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=Path('atlas_d_simulator_01/contact/y14');p=json.loads((r/'evidence/public-browser.json').read_text());assert p['passed']
          release={'status':'Exact public assets and four-vessel chart/control operation verified','sourceCommit':os.environ['GITHUB_SHA'],'publishedCommit':os.environ['PUBLIC_COMMIT'],'url':os.environ['PUBLIC_URL'],'reportURL':os.environ['PUBLIC_URL'].replace('index.html','report.html'),'navigationTests':27,'dynamicsTests':50,'geometryOpticsSourceTests':36,'oneActiveVessel':True,'localDepthCycles':['d','n','pod'],'seaTrialValidated':False,'realChart':False,'physicalDeviceTested':False,'multiplayer':False,'sharedHostMerged':False}
          (r/'RELEASE.json').write_text(json.dumps(release,indent=2));print(json.dumps(release,indent=2))
          PY
          git add atlas_d_simulator_01/contact/y14/RELEASE.json
          git commit -m 'Record verified public Y14 navigation and realism release'
          git push origin HEAD:refs/heads/atlas-d/fleet-navigation-y14-20261023
          echo "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact source and real outcome fingerprints
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('atlas_d_simulator_01/contact/y14');e=r/'evidence';e.mkdir(exist_ok=True)
          files={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in r.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='artifact-manifest.json'}
          (e/'artifact-manifest.json').write_text(json.dumps({'sourceCommit':os.environ['GITHUB_SHA'],'publishedCommit':os.environ.get('PUBLIC_COMMIT'),'url':os.environ.get('PUBLIC_URL'),'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-D-SUMARS-Y14-navigation-realism-review
          path: |
            atlas_d_simulator_01/contact/y14/
            !atlas_d_simulator_01/contact/y14/__pycache__/**
          retention-days: 14

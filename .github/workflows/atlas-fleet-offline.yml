name: ATLAS Fleet offline review
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_fleet_v1/offline_bundle.py'
      - '.github/workflows/atlas-fleet-offline.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
      - name: Package exact assets and test file URLs with network disabled
        env:
          OFFLINE_OUT: /tmp/atlas-fleet-offline
        run: python atlas_fleet_v1/offline_bundle.py
      - name: Record offline verification separately from public hosting
        run: |
          cp /tmp/atlas-fleet-offline/offline_validation.json atlas_fleet_v1/offline_validation.json
          git config user.name 'ATLAS release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas_fleet_v1/offline_validation.json
          git commit -m 'Record offline local-file fleet checks; public hosting remains unverified'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Fleet-01-Offline-Viewer-and-Evidence
          path: /tmp/atlas-fleet-offline/
          retention-days: 30

name: ATLAS Bay 25 Studio 05
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_bay_studio_05/transport/**'
      - 'atlas_bay_studio_05/fixups.py'
      - '.github/workflows/atlas-bay-studio-05.yml'
permissions:
  contents: write
concurrency:
  group: atlas-bay-studio-05
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FLEET_ROOT: ${{ github.workspace }}/atlas_bay_studio_05
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore approved baseline and checksum-verified study source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,json
          root=Path('atlas_bay_studio_05')
          data=base64.b64decode(''.join((root/'transport'/f'part{i}.b64').read_text().strip() for i in range(2)),validate=True)
          assert hashlib.sha256(data).hexdigest()=='396514cb80685dee791df6467ffa417661263623d416284ee982105f3dea7f20','Source transport checksum mismatch'
          for name,text in json.loads(lzma.decompress(data)).items():
              assert Path(name).name==name and name.endswith(('.py','.js','.md'))
              (root/name).write_text(text)
          PY
          git fetch --no-tags origin 342010e19868a03d79527285aad7aeaa5d3f3dae
          mkdir -p /tmp/bay05-base /tmp/bay05/review "$FLEET_ROOT/models" "$FLEET_ROOT/staging"
          git archive 342010e19868a03d79527285aad7aeaa5d3f3dae atlas_bay_studio_04/live atlas_bay_studio_04/source | tar -x -C /tmp/bay05-base
          cp -R /tmp/bay05-base/atlas_bay_studio_04/live "$FLEET_ROOT/site"
          cp -R /tmp/bay05-base/atlas_bay_studio_04/source "$FLEET_ROOT/source"
          cp "$FLEET_ROOT/draft.js" "$FLEET_ROOT/site/draft.js"
          if [ -f "$FLEET_ROOT/fixups.py" ]; then python "$FLEET_ROOT/fixups.py"; fi
      - name: Refine fishing equipment and calculate explicitly hypothetical hydrostatics
        run: |
          python -m pip install -q numpy==2.3.5 trimesh==4.11.1 scipy shapely networkx pillow matplotlib playwright==1.55.0
          python "$FLEET_ROOT/refine05.py"
          python "$FLEET_ROOT/prepare05.py"
      - name: Save two native Blender masters and export their actual geometry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 >/dev/null
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/blender -b --python-exit-code 1 --python "$FLEET_ROOT/native05.py"
          python "$FLEET_ROOT/audit05.py"
          python - <<'PY'
          from pathlib import Path
          import os,hashlib,json
          r=Path(os.environ['FLEET_ROOT']);old=Path('/tmp/bay05-base/atlas_bay_studio_04/live/assets')
          report={}
          for name in ['ATLAS_D.glb','ATLAS_N.glb','ATLAS_N_Interior.glb','ATLAS_W.glb','ATLAS_W_Interior.glb','ATLAS_Chase_12.glb']:
              a=hashlib.sha256((old/name).read_bytes()).hexdigest();b=hashlib.sha256((r/'site/assets'/name).read_bytes()).hexdigest()
              assert a==b,name+' unexpectedly changed'
              report[name]={'sha256':b,'unchanged':True}
          (r/'site/unchanged_assets.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Verify six rod holders, draft controls and all retained fleet entries
        run: |
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8816 --bind 127.0.0.1 --directory "$FLEET_ROOT/site" >/tmp/bay05/http.log 2>&1 &
          sleep 2
          BASE_URL=http://127.0.0.1:8816/index.html REVIEW_DIR=/tmp/bay05/review python "$FLEET_ROOT/verify05.py"
      - name: Publish separate Studio 05 without replacing the approved baseline
        id: release
        run: |
          mkdir -p "$FLEET_ROOT/live"
          cp -R "$FLEET_ROOT/site/." "$FLEET_ROOT/live/"
          cp /tmp/bay05/review/validation.json "$FLEET_ROOT/live/browser_validation.json"
          git config user.name 'ATLAS release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f atlas_bay_studio_05/live atlas_bay_studio_05/*.py atlas_bay_studio_05/draft.js atlas_bay_studio_05/DESIGN_NOTES.md
          git commit -m 'Publish Bay Studio 05: six holders, fishing details and labeled shallow-hull investigation'
          git stash push -u -m bay05-generated-assets
          git pull --rebase origin main
          git push origin HEAD:main
          echo "url=https://rawcdn.githack.com/owensto/helper/$(git rev-parse HEAD)/atlas_bay_studio_05/live/index.html" >> "$GITHUB_OUTPUT"
          git stash pop || true
      - name: Test exact public viewer and optional hull controls
        env:
          BASE_URL: ${{ steps.release.outputs.url }}
          REVIEW_DIR: /tmp/bay05/public
        run: python "$FLEET_ROOT/verify05.py"
      - name: Record actual public evidence
        run: |
          cp /tmp/bay05/public/validation.json "$FLEET_ROOT/online_validation.json"
          git add atlas_bay_studio_05/online_validation.json
          git commit -m 'Record public Bay 05 tests separately from unvalidated vessel engineering'
          git stash push -u -m bay05-generated-evidence
          git pull --rebase origin main
          git push origin HEAD:main
          git stash pop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Bay-25-Studio-05-Models-Viewer-Review
          path: |
            /tmp/bay05/
            atlas_bay_studio_05/models/
            atlas_bay_studio_05/site/
            atlas_bay_studio_05/source/
            atlas_bay_studio_05/*.py
            atlas_bay_studio_05/*.js
            atlas_bay_studio_05/*.md
          retention-days: 30

name: ATLAS Sea Lab 08 realism review
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_sealab_08/realism08.js'
      - 'atlas_sealab_08/realism08.css'
      - 'atlas_sealab_08/patch08.py'
      - 'atlas_sealab_08/review_fixups.py'
      - '.github/workflows/atlas-sealab-08.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-sealab-08-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SEA_ROOT: ${{ github.workspace }}/atlas_sealab_08
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38780998833
          artifact-ids: 11996022685
          path: /tmp/sea08/base
          merge-multiple: true
      - name: Restore retained boat, recorded audio, geodata and existing functional suite
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,shutil
          r=Path(os.environ['SEA_ROOT']);src=next(Path('/tmp/sea08/base').rglob('site/radio07.js')).parent.parent
          for name in ['site','models','source']:
              shutil.copytree(src/name,r/name,dirs_exist_ok=True)
          for name in ['verify07.py','speed_tests07.js','audit06.py','geometry07.py','music07.py','native07.py']:
              shutil.copy2(src/name,r/name)
          PY
          python "$SEA_ROOT/patch08.py"
          if [ -f "$SEA_ROOT/review_fixups.py" ]; then python "$SEA_ROOT/review_fixups.py"; fi
          for f in "$SEA_ROOT/site/"*.js; do node --check "$f"; done
          mkdir -p /tmp/sea08/review
          node "$SEA_ROOT/source/test_command.js" > /tmp/sea08/review/motion_tests.json
          node "$SEA_ROOT/speed_tests07.js" > /tmp/sea08/review/speed_tests08.json
      - name: Browser validation and real audio capture
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8898 --bind 127.0.0.1 --directory "$SEA_ROOT/site" >/tmp/sea08/http.log 2>&1 &
          sleep 2
          BASE_URL=http://127.0.0.1:8898/index.html REVIEW_DIR=/tmp/sea08/review RADIO_TEST_FILE="$SEA_ROOT/site/assets/audio/lowcountry_drift.ogg" python "$SEA_ROOT/verify08.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-SeaLab08-Review
          path: |
            /tmp/sea08/review/
            /tmp/sea08/http.log
            atlas_sealab_08/site/
            atlas_sealab_08/models/
            atlas_sealab_08/source/
            atlas_sealab_08/*.py
            atlas_sealab_08/*.js
            atlas_sealab_08/*.css
          retention-days: 30

name: ATLAS Bay 25 Studio 03
on:
  workflow_dispatch:
  push:
    paths:
      - 'atlas_bay_studio_03/transport/**'
      - 'atlas_bay_studio_03/fixups.py'
      - 'atlas_bay_studio_03/REVIEW.md'
      - '.github/workflows/atlas-bay-studio-03.yml'
permissions:
  contents: write
concurrency:
  group: atlas-bay-studio-03
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      FLEET_ROOT: ${{ github.workspace }}/atlas_bay_studio_03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore exact base and checksum-verified new source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          root=Path('atlas_bay_studio_03')
          data=base64.b64decode(''.join((root/'transport'/f'part{i}.b64').read_text().strip() for i in range(2)),validate=True)
          assert hashlib.sha256(data).hexdigest()=='cdfa55e8be5809a193482fa11becd5d5deab81e122b5a2274c7b2388bb76434d','Source transport checksum mismatch'
          for name,text in json.loads(lzma.decompress(data)).items():
              assert Path(name).name==name and name.endswith('.py')
              (root/name).write_text(text)
          PY
          git fetch --no-tags origin f2ab5e5f67263bbae8ddbfe0415c2b0579406de5
          mkdir -p /tmp/bay03-base /tmp/bay03/review "$FLEET_ROOT/models" "$FLEET_ROOT/staging"
          git archive f2ab5e5f67263bbae8ddbfe0415c2b0579406de5 atlas_fleet_atelier_02/source atlas_fleet_atelier_02/live | tar -x -C /tmp/bay03-base
          cp -R /tmp/bay03-base/atlas_fleet_atelier_02/source "$FLEET_ROOT/source"
          cp -R /tmp/bay03-base/atlas_fleet_atelier_02/live "$FLEET_ROOT/site"
          if [ -f "$FLEET_ROOT/fixups.py" ]; then python "$FLEET_ROOT/fixups.py"; fi
      - name: Rebuild fishing tender and record limited standalone fit screen
        run: |
          python -m pip install -q numpy==2.3.5 trimesh==4.11.1 scipy networkx shapely matplotlib pillow playwright==1.55.0
          python "$FLEET_ROOT/refine.py"
          python "$FLEET_ROOT/prepare.py"
      - name: Export actual Blender master and render real model stills
        env:
          ATLAS_STILLS: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 >/dev/null
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/blender -b --python-exit-code 1 --python "$FLEET_ROOT/native.py"
          test -s "$FLEET_ROOT/models/ATLAS_Bay_25_Studio03.blend"
          python - <<'PY'
          from pathlib import Path
          import os,hashlib,json
          r=Path(os.environ['FLEET_ROOT']);old=Path('/tmp/bay03-base/atlas_fleet_atelier_02/live/assets')
          files=['ATLAS_D.glb','ATLAS_N.glb','ATLAS_N_Interior.glb','ATLAS_W.glb','ATLAS_W_Interior.glb','ATLAS_Chase_12.glb']
          report={}
          for f in files:
              a=hashlib.sha256((old/f).read_bytes()).hexdigest();b=hashlib.sha256((r/'site/assets'/f).read_bytes()).hexdigest()
              assert a==b,f+' unintentionally changed'
              report[f]={'sha256':b,'unchanged':True}
          (r/'site/unchanged_assets.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Verify geometry comparisons and all retained fleet controls
        run: |
          python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8825 --bind 127.0.0.1 --directory "$FLEET_ROOT/site" >/tmp/bay03/http.log 2>&1 &
          sleep 2
          BASE_URL=http://127.0.0.1:8825/index.html REVIEW_DIR=/tmp/bay03/review python "$FLEET_ROOT/verify.py"
      - name: Publish separate Bay-first revision
        id: release
        run: |
          mkdir -p "$FLEET_ROOT/live"
          cp -R "$FLEET_ROOT/site/." "$FLEET_ROOT/live/"
          cp /tmp/bay03/review/validation.json "$FLEET_ROOT/live/browser_validation.json"
          git config user.name 'ATLAS release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f atlas_bay_studio_03/live atlas_bay_studio_03/source atlas_bay_studio_03/*.py
          git commit -m 'Publish Bay 25 Studio 03: rebuilt fishing tender and same-camera comparison'
          git stash push -u -m bay03-generated-assets
          git pull --rebase origin main
          git push origin HEAD:main
          git stash pop || true
          echo "url=https://rawcdn.githack.com/owensto/helper/$(git rev-parse HEAD)/atlas_bay_studio_03/live/index.html" >> "$GITHUB_OUTPUT"
      - name: Test exact public release, not injected local assets
        env:
          BASE_URL: ${{ steps.release.outputs.url }}
          REVIEW_DIR: /tmp/bay03/public
        run: python "$FLEET_ROOT/verify.py"
      - name: Record public evidence
        run: |
          cp /tmp/bay03/public/validation.json "$FLEET_ROOT/online_validation.json"
          git add atlas_bay_studio_03/online_validation.json
          git commit -m 'Record Bay Studio 03 public controls and comparison verification'
          git stash push -u -m bay03-evidence
          git pull --rebase origin main
          git push origin HEAD:main
          git stash pop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-Bay-25-Studio-03-Model-Viewer-Review
          path: |
            /tmp/bay03/
            atlas_bay_studio_03/models/
            atlas_bay_studio_03/site/
            atlas_bay_studio_03/source/
            atlas_bay_studio_03/*.py
          retention-days: 30

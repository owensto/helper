name: ATLAS mobile fleet public verification
on:
  push:
    branches: ['atlas/fleet-mobile-warship-20261022']
    paths: ['atlas_fleet_mobile/**', '.github/workflows/atlas-fleet-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-fleet-mobile-warship-20261022
  cancel-in-progress: false
jobs:
  fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PUBLIC_SHA: 8d7df3837046bdbf3b04bf4c4fca245a37aba2a5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            atlas_fleet_mobile
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify immutable site and execute original logic tests
        run: |
          test "$GITHUB_REF_NAME" = atlas/fleet-mobile-warship-20261022
          git fetch --depth=1 origin "$PUBLIC_SHA"
          git diff --exit-code "$PUBLIC_SHA" HEAD -- atlas_fleet_mobile/site
          mkdir -p /tmp/atlas-fleet-review/committed
          cp atlas_fleet_mobile/*.py atlas_fleet_mobile/*.js atlas_fleet_mobile/*.cjs /tmp/atlas-fleet-review/committed/
          python atlas_fleet_mobile/refine.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          r=Path('atlas_fleet_mobile/site')
          b=json.loads((r/'BUILD.json').read_text())
          assert len(b['files'])==14
          for n,h in b['files'].items():assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n
          print('All14 published payload hashes PASS; no runtime changes')
          PY
          for p in atlas_fleet_mobile/site/*.js; do node --check "$p"; done
          python -m py_compile atlas_fleet_mobile/verify.py atlas_fleet_mobile/verify_release.py
          cd atlas_fleet_mobile
          node --test test.cjs > unit.tap
      - name: Prepare pinned browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium > /tmp/fleet-browser-install.log
      - name: Verify unchanged public fleet and capture exact response evidence
        env:
          REVIEW_DIR: /tmp/atlas-fleet-review/public
          BASE_URL: https://rawcdn.githack.com/owensto/helper/8d7df3837046bdbf3b04bf4c4fca245a37aba2a5/atlas_fleet_mobile/site/index.html
        run: python atlas_fleet_mobile/verify_release.py
      - name: Preserve source and all outcomes
        if: always()
        run: |
          mkdir -p /tmp/atlas-fleet-review/source /tmp/atlas-fleet-review/site
          cp atlas_fleet_mobile/*.py atlas_fleet_mobile/*.js atlas_fleet_mobile/*.cjs /tmp/atlas-fleet-review/source/ 2>/dev/null || true
          cp -r atlas_fleet_mobile/site/. /tmp/atlas-fleet-review/site/
          cp atlas_fleet_mobile/unit.tap /tmp/atlas-fleet-review/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('/tmp/atlas-fleet-review')
          (r/'provenance.json').write_text(json.dumps({'testSourceSHA':os.environ['GITHUB_SHA'],'publicSHA':os.environ['PUBLIC_SHA'],'runtime':'Chromium/SwiftShader; not physical mobile hardware','runtimeModified':False,'publicationPerformed':False},indent=2))
          (r/'sha256.json').write_text(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-mobile-fleet-public-verification
          path: /tmp/atlas-fleet-review/
          retention-days: 14

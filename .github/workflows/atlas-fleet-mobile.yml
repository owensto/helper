name: ATLAS mobile fleet
on:
  push:
    branches: ['atlas/fleet-mobile-warship-20261022']
    paths: ['atlas_fleet_mobile/**', '.github/workflows/atlas-fleet-mobile.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-fleet-mobile-warship-20261022
  cancel-in-progress: false
jobs:
  fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            atlas_fleet_mobile
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble exact owner assets and execute logic tests
        run: |
          test "$GITHUB_REF_NAME" = atlas/fleet-mobile-warship-20261022
          git fetch --depth=1 origin 170f328708accc967f36bbb57c6f7ad02c6d38cb 5d0e90f070643c4b3ee8b1602ec1dba88594cf15
          python atlas_fleet_mobile/build.py
          for p in atlas_fleet_mobile/site/*.js; do node --check "$p"; done
          python -m py_compile atlas_fleet_mobile/verify.py
          cd atlas_fleet_mobile
          node --test test.cjs > unit.tap
      - name: Prepare pinned browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium > /tmp/fleet-browser-install.log
      - name: Candidate native selection and sailing
        env:
          REVIEW_DIR: /tmp/atlas-fleet-review/local
        run: |
          python -m http.server 8931 --bind 127.0.0.1 --directory atlas_fleet_mobile/site > /tmp/fleet-http.log 2>&1 &
          sleep 2
          python atlas_fleet_mobile/verify.py
      - name: Publish only new fleet path after candidate pass
        id: publish
        run: |
          git config user.name 'ATLAS fleet release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas_fleet_mobile/site
          git commit -m 'Publish tested mobile fleet candidate [skip ci]'
          git push origin HEAD:refs/heads/atlas/fleet-mobile-warship-20261022
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify exact public fleet with native controls
        env:
          REVIEW_DIR: /tmp/atlas-fleet-review/public
          BASE_URL: https://rawcdn.githack.com/owensto/helper/${{ steps.publish.outputs.sha }}/atlas_fleet_mobile/site/index.html
        run: python atlas_fleet_mobile/verify.py
      - name: Preserve source and all outcomes
        if: always()
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          mkdir -p /tmp/atlas-fleet-review/source /tmp/atlas-fleet-review/site
          cp atlas_fleet_mobile/*.py atlas_fleet_mobile/*.js atlas_fleet_mobile/*.cjs /tmp/atlas-fleet-review/source/ 2>/dev/null || true
          cp atlas_fleet_mobile/site/*.* /tmp/atlas-fleet-review/site/ 2>/dev/null || true
          cp atlas_fleet_mobile/unit.tap /tmp/atlas-fleet-review/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('/tmp/atlas-fleet-review')
          (r/'provenance.json').write_text(json.dumps({'sourceSHA':os.environ['GITHUB_SHA'],'publicSHA':os.environ.get('PUBLIC_SHA'),'runtime':'Chromium/SwiftShader; not physical mobile hardware'},indent=2))
          (r/'sha256.json').write_text(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-mobile-fleet-review
          path: /tmp/atlas-fleet-review/
          retention-days: 14
